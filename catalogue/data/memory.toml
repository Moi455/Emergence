# memory.toml - étape 8 : la mémoire épisodique (ce qu'on a vécu, vu, appris, et ce qu'on en a pensé).
#
# Un souvenir = ce qu'on a PERÇU d'un fait (qui peut différer du fait : pénombre, distance, ivresse,
# erreur sur la personne) + son appréciation (valence, importance, interprétation, émotion).
# Le moteur crée le souvenir à la perception et le lie au fait réel (fact_ref, invisible à l'IA) ;
# le Transformer l'apprécie à la création (saut permis), puis le RÉINTERPRÈTE par petits pas (pas
# de 1 : « je croyais qu'il m'avait trahi ; j'ai compris qu'il me protégeait »).
# Les détails s'estompent (vividness) : un souvenir flou peut se déformer, d'où les faux souvenirs.
# Les souvenirs répétés se consolident en croyances (« il ment souvent ») : c'est une déduction du
# Transformer, écrite comme une croyance (source inferred), pas une règle.
# Budget de l'IA : ≤ 9 jetons MEMORY par décision, choisis par pertinence (personnes présentes,
# sujet, lieu, objectifs) ; un souvenir = un jeton avec des pointeurs.

variable = [
  { id = "m_content", label_fr = "ce qui a été perçu (proposition : qui a fait quoi, sur quoi)", holder = "episode", scale = "proposition", writer = ["engine", "T_jump"], dynamics = "le moteur l'écrit tel que perçu (pas tel qu'il s'est passé) ; il se déforme quand la netteté baisse ; le Transformer peut aussi créer un souvenir (charte § 8)", token = "MEMORY.prop", clock = "day" },
  { id = "m_fact_ref", label_fr = "le fait réel (lien pour le moteur)", holder = "episode", scale = "id", writer = ["engine"], visibility = "engine", note = "Jamais dans un jeton." },
  { id = "m_when", label_fr = "quand", holder = "episode", scale = "time", writer = ["engine"], token = "MEMORY.age" },
  { id = "m_where", label_fr = "où", holder = "episode", scale = "mref", writer = ["engine"], token = "MEMORY.place (pointeur)" },
  { id = "m_role", label_fr = "son rôle dans ce fait (auteur, cible, témoin, l'a appris)", holder = "episode", scale = "enum", values = ["actor", "target", "witness", "told"], writer = ["engine"], token = "MEMORY.role" },
  { id = "m_valence", label_fr = "ce que ce souvenir fait ressentir (−10 blessure, +10 bonheur)", holder = "episode", writer = ["T_jump", "T_step"], step = 1.0, rate = 1.0, dynamics = "libre à la création ; ensuite réinterprété par pas de 1", token = "MEMORY.valence", clock = "day" },
  { id = "m_importance", label_fr = "importance (règle l'oubli et ce qui revient à l'esprit)", holder = "episode", scale = "unipolar10", writer = ["T_jump", "T_step"], step = 1.0, rate = 1.0, dynamics = "libre à la création ; ensuite pas de 1", token = "MEMORY.importance", clock = "day" },
  { id = "m_interpretation", label_fr = "le jugement porté (vol, trahison, accident, générosité, injustice, rien de spécial…)", holder = "episode", scale = "word", writer = ["T_jump"], dynamics = "une interprétation du catalogue (étape 14) ; peut changer quand on apprend autre chose", token = "MEMORY.interp", clock = "day" },
  { id = "m_emotion", label_fr = "l'émotion dominante liée au souvenir", holder = "episode", scale = "enum", values_from = "emotion", writer = ["T_jump"], dynamics = "se réveille quand le souvenir revient (le moteur rappelle, le modèle ressent)", token = "MEMORY.emotion", clock = "day" },
  { id = "m_defining", label_fr = "souvenir marquant (fait partie de qui l'on est ; ne s'oublie pas)", holder = "episode", scale = "bool", writer = ["T_jump"], token = "MEMORY.defining" },
  { id = "m_secret", label_fr = "souvenir qu'on cache", holder = "episode", scale = "bool", writer = ["T_jump"], token = "MEMORY.secret" },
  { id = "m_vividness", label_fr = "netteté (les détails s'estompent)", holder = "episode", scale = "unipolar10", writer = ["engine"], dynamics = "baisse avec le temps selon la mémoire de la personne ; les rappels et les récits la remontent ; basse, les détails (qui exactement, combien) deviennent incertains ou glissent", token = "MEMORY.vividness", clock = "day" },
  { id = "m_rehearsals", label_fr = "combien de fois on y a repensé ou l'a raconté", holder = "episode", scale = "qty", writer = ["engine"], dynamics = "consolide le souvenir ; un souvenir trop raconté s'embellit", clock = "day" },
  { id = "memory_store_capacity", label_fr = "nombre de souvenirs gardés", holder = "memory", scale = "qty", writer = ["derived"], visibility = "engine", dynamics = "de 32 à 128 selon la mémoire (memory_capacity) ; s'oublie le moins important, le moins net, le plus ancien ; jamais un souvenir marquant", clock = "day" },
]
