# mind_dynamic.toml - étape 5 : l'esprit mouvant (ce que la personne RESSENT et VEUT maintenant).
#
# Émotions : tirées de la théorie de l'évaluation (on ressent selon la façon dont on juge ce qui
# arrive) : les émotions de base et les émotions sociales qui font les histoires (honte, culpabilité,
# jalousie, envie, gratitude, mépris). Le Transformer peut les faire SAUTER (D18, charte § 6) : c'est
# lui qui juge ce qui arrive. Le moteur n'écrit que la physiologie, pas l'évaluation :
#   - le retour vers l'humeur de fond, à la vitesse du tempérament (resilience) ;
#   - les effets du corps (la douleur, la faim, le manque de sommeil, l'ivresse rendent irritable) ;
#   - jamais « il a été insulté donc colère + 3 » : c'est au modèle de le décider.
# Besoins psychologiques (drives) : montent tout seuls selon la situation (le moteur, une loi), le
# Transformer les déplace par petits pas (0,5) ; ils pèsent sur ce qu'il cherche.
# Budget de l'IA : un jeton SELF_STATE (≈ 34 valeurs) ; les autres ne voient que l'apparence.

