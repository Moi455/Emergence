# beliefs.toml - étape 6 : les croyances. Le cœur de l'émergence sociale.
#
# Une croyance = une proposition (language_core.toml) + certitude + source + poids + date.
# Elles portent : le savoir (où est la source, qui habite où, ce que vaut un cochon, comment on forge),
# la théorie de l'esprit (« elle me hait », « il ment »), la réputation (has_trait), les liens crus
# (link : on peut croire que X est son père et se tromper), la propriété (owns), les rôles et leurs
# pouvoirs (holds, may), les normes (norm), les coutumes (custom), les légendes (exists), et les
# secrets. Aucune variable ad hoc par situation.
#
# Qui écrit (règle centrale, pour qu'aucune crédulité ne soit écrite à la main) :
#   - le MOTEUR enregistre ce qui est PERÇU (« j'ai vu X prendre le pain », certitude selon la vue,
#     la lumière, l'attention) et ce qui est DIT (« Y m'a dit que P », source told, informateur noté) ;
#     il fait oublier (capacité, saillance) ;
#   - le TRANSFORMER décide d'adopter P, d'en douter, de déduire, de réviser, de garder secret.
#   Les rumeurs, l'erreur, la crédulité, la méfiance naissent de là.
# La vérité d'une croyance est connue du moteur seul (truth) : jamais montrée à l'IA ni au joueur.
# Budget de l'IA : ≤ 12 jetons BELIEF par décision, choisis par pertinence (entités présentes, sujet
# de la conversation, objectifs) ; une croyance = un jeton (prédicat, ≤ 3 pointeurs, polarité, temps,
# certitude, source, poids, secret).

variable = [
  # ─── La croyance ───
  { id = "b_proposition", label_fr = "ce qui est cru (proposition)", holder = "belief", scale = "proposition", writer = ["engine", "T_jump"], dynamics = "le moteur crée les perçues et les entendues ; le Transformer crée les déduites et adopte les entendues", token = "BELIEF.prop", clock = "day" },
  { id = "b_polarity", label_fr = "cru vrai ou cru faux", holder = "belief", scale = "bool", writer = ["engine", "T_jump"], token = "BELIEF.polarity" },
  { id = "b_certainty", label_fr = "certitude", holder = "belief", scale = "unipolar10", writer = ["engine", "T_jump"], dynamics = "le moteur la fixe pour une perception (vue, lumière, distance, attention, ivresse) ; le Transformer la révise d'un coup devant une preuve", token = "BELIEF.certainty", clock = "day" },
  { id = "b_weight", label_fr = "poids : combien on y tient (force d'une norme, valeur qu'on donne à une chose)", holder = "belief", writer = ["T_step"], step = 0.3, rate = 0.3, dynamics = "une norme change lentement chez chacun, par de nombreuses décisions ; la coutume d'un village suit", token = "BELIEF.weight", clock = "day" },
