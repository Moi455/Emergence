# stories.toml - SONDES d'expressivité, pas la source du catalogue.
#
# Le catalogue vient des premiers principes (gestes et mots simples dont les combinaisons émergent).
# Chaque histoire pose une seule question : « le catalogue permet-il d'exprimer ceci ? ».
# status : todo | expressible | gap. Un manque se comble par une primitive GÉNÉRALE, jamais par une
# entrée propre à l'histoire. Une histoire ne justifie aucune entrée et ne contraint aucun PNJ.
# Règle dure (D10) : aucune histoire romantique ou sexuelle impliquant un enfant ou un adolescent.

# ─── Violence physique : un seul geste, des manières différentes (Monsieur, 9 oct.) ────────────────
[[story]]
id = "slap_after_insult"
status = "expressible"
actions = ["strike", "go"]
variables = ["pain", "expression", "involuntary_signs", "anger", "shame"]
note = "strike(head, open_hand, swing, light, c_done) puis go : une gifle"
charter = ["§6", "§8"]
text_fr = "Après une remarque humiliante, une femme gifle un homme devant la taverne, puis s'en va."

[[story]]
id = "punch_in_brawl"
status = "expressible"
actions = ["strike", "grab", "push"]
variables = ["pain", "wounds", "condition", "intoxication", "anger"]
note = "strike(head, fist, swing, firm, c_done) ; l'aubergiste : grab + push pour séparer"
charter = ["§8", "§27"]
text_fr = "Deux ivrognes se disputent une chope ; l'un donne un coup de poing, l'autre tombe, la bagarre s'arrête quand l'aubergiste les sépare."

[[story]]
id = "beating_near_death"
status = "expressible"
actions = ["strike", "go"]
variables = ["wounds", "consciousness", "bleeding", "condition", "r_resentment"]
note = "strike(any, fist, swing, hard, c_target_still) puis go (away) ; le rival survit, inconscient"
charter = ["§6", "§25"]
text_fr = "Un homme rancunier roue de coups son rival jusqu'à ce qu'il ne bouge plus, puis s'arrête et fuit ; le rival survit, blessé pour des semaines."

[[story]]
id = "killed_by_blows"
status = "expressible"
actions = ["strike"]
variables = ["wounds", "consciousness", "blood_volume", "alive", "condition"]
note = "strike(head, foot, swing, full, c_target_still) prolongé après la perte de conscience : la mort vient du corps, personne n'a choisi « tuer »"
charter = ["§25"]
text_fr = "Une rixe dégénère : les coups continuent après la perte de connaissance et la victime meurt. Personne n'avait décidé de « tuer »."

[[story]]
id = "self_defense_kill"
charter = ["§5", "§25"]
text_fr = "Attaqué au couteau sur un chemin, un bûcheron frappe avec sa hache et tue son agresseur ; au village, certains parlent de légitime défense, d'autres de meurtre."

[[story]]
