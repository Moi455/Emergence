# actions.toml - étape 12 : les gestes du corps. La seule chose qu'un PNJ (ou le joueur) « fait ».
#
# Axe parcouru : tout ce qu'un corps humain peut faire au monde, en primitives générales, chacune
# paramétrée par la MANIÈRE (D28). Aucun geste ne porte un sens social : voler = take (discrètement,
# ce qu'on croit à autrui) ; tuer = strike jusqu'à l'immobilité ; soigner = work (presser un bandage) ;
# faire chanter = speak (la menace est dans le contenu) ; bâtir = put ou channel ; empoisonner = pour
# une fiole dans une chope. Le moteur applique les PROCESSUS (matter.toml) que la physique permet.
# Le joueur passe par les mêmes 40 gestes (charte § 14) ; ses gestes arrivent aux témoins en EVENT.
#
# Budget de l'IA (revue du 9 oct.) : 40 gestes ≤ 64 ; têtes de sortie PARTAGÉES entre gestes :
#   intensity  : faint, light, firm, hard, full   (une seule échelle de force, ordinale)
#   stealth    : open, discreet
#   zone       : head, torso, arms, legs, any
#   duration   : brief, a_while, long             amount : little, some, all
#   until      : une condition de conditions.toml (c_done = une fois)
#   ref        : un pointeur vers les dossiers mentaux du PNJ (personne, bête, chose, construction,
#                terrain, voxel visé, eau, feu, lieu, trace, croyance, forme…), accepts = ce qu'il vise.
# D10 (table unique, revue du 10 oct.) : tout geste dont un pointeur peut viser une personne déclare
# contact ; un geste de contact déclare party_params (qui est touché), minor_person_ok (permis ou non
# avec un mineur) et minor_whitelist (les seules valeurs permises alors ; chaque paramètre listé devient
# OBLIGATOIRE). Les zones touchées sur un mineur ne sortent jamais de : tête, épaule, bras, mains, dos,
# jambes. Mineur = âge réel, cru ou apparent, ou dossier non résolu. Les valeurs intimes n'y sont jamais. Animations : docs/interfaces.md § 7 ; « + » = clip à ajouter.

# ─── Déplacement ────────────────────────────────────────────────────────────────────────────────
[[action]]
id = "go"
family = "move"
label_fr = "aller : vers quelque chose, en le suivant, ou en s'en écartant (marcher, courir, fuir, suivre, pister, conduire une monture ou une barque)"
params = [
  { name = "target", type = "ref", accepts = ["place", "agent", "animal", "item", "structure", "trace", "water", "direction"] },
  { name = "relation", type = "enum", values = ["toward", "along", "away"], note = "along : suivre (une personne, une trace, une rivière) ; away : s'écarter, fuir" },
  { name = "pace", type = "enum", values = ["slow", "walk", "brisk", "run"], ordinal = true },
  { name = "stealth", type = "enum", values = ["open", "discreet"] },
  { name = "stop_at", type = "enum", values = ["touch", "near", "talk", "sight"], ordinal = true, optional = true },
]
uses = ["t_stealth", "t_riding", "t_fishing", "t_hunting"]
contact = false
effects = "déplacement sur la navigation ; monté ou en barque, c'est la monture ou le véhicule qui va (maîtrise) ; la course épuise ; discret : moins de bruit, reste hors des regards quand c'est possible"
perceptibility = "vu ; pas entendus selon l'allure, le sol, la discrétion"
duration = "jusqu'à l'arrivée, la distance voulue ou l'interruption"
animation = ["walk", "run", "sneak", "turn_l", "turn_r", "+ride", "+row"]

[[action]]
id = "climb"
family = "move"
label_fr = "grimper, escalader, descendre une paroi"
params = [
  { name = "target", type = "ref", accepts = ["structure", "terrain", "voxel", "item", "plant"] },
  { name = "pace", type = "enum", values = ["slow", "walk", "brisk"], ordinal = true },
]
requires = { target = "climbable" }
uses = ["t_climbing"]
effects = "chute possible selon la maîtrise, l'allure, la charge, la prise mouillée"
perceptibility = "vu"
duration = "selon la hauteur"
animation = ["climb_ladder", "+climb_wall"]

[[action]]
id = "swim"
family = "move"
label_fr = "nager"
params = [
  { name = "target", type = "ref", accepts = ["place", "water", "direction"] },
  { name = "intensity", type = "enum", values = ["faint", "light", "firm", "hard", "full"], ordinal = true },
]
uses = ["t_swimming"]
effects = "épuise ; le courant emporte ; sans maîtrise, trop chargé ou épuisé, le souffle manque : noyade"
perceptibility = "vu, entendu"
duration = "selon la distance"
animation = ["swim"]

[[action]]
id = "jump"
family = "move"
label_fr = "sauter"
params = [
  { name = "target", type = "ref", accepts = ["place", "direction", "voxel", "water"] },
  { name = "intensity", type = "enum", values = ["faint", "light", "firm", "hard", "full"], ordinal = true },
]
effects = "franchit un fossé, descend d'un toit, plonge ; mauvaise réception : blessure aux jambes"
perceptibility = "vu"
duration = "un instant"
animation = ["jump"]

[[action]]
id = "mount"
family = "move"
label_fr = "monter sur une bête ou dans un véhicule, en descendre"
params = [
  { name = "target", type = "ref", accepts = ["animal", "item"] },
  { name = "mode", type = "enum", values = ["get_on", "get_off"] },
]
uses = ["t_riding"]
effects = "une bête mal dressée peut refuser ou désarçonner ; ensuite go conduit"
perceptibility = "vu"
duration = "quelques secondes"
animation = ["+mount"]

# ─── Posture ────────────────────────────────────────────────────────────────────────────────────
[[action]]
id = "set_posture"
family = "posture"
label_fr = "se tenir (debout, assis, à genoux, accroupi, couché)"
params = [{ name = "posture", type = "enum", values = ["stand", "sit", "kneel", "crouch", "lie_down"] }]
effects = "accroupi derrière ce qui cache : on est caché ; ce que les autres pensent d'un genou à terre leur appartient"
perceptibility = "vu"
duration = "un instant"
animation = ["sit_down", "stand_up", "lie_down", "get_up", "kneel_work"]

# ─── Saisir, poser, donner, porter ──────────────────────────────────────────────────────────────
[[action]]
id = "take"
family = "grasp"
label_fr = "prendre, ramasser, porter (un objet ; un enfant, un blessé, un corps ; au sol, dans un contenant, des mains de quelqu'un, sur quelqu'un)"
params = [
  { name = "target", type = "ref", accepts = ["item", "agent", "animal"] },
  { name = "from", type = "enum", values = ["ground", "container", "hand_of", "worn_by"], note = "worn_by : à la ceinture, dans la bourse, sur le corps" },
  { name = "hold", type = "enum", values = ["in_hand", "in_arms", "on_back", "by_arm"], note = "by_arm : soutenir quelqu'un qui marche" },
  { name = "stealth", type = "enum", values = ["open", "discreet"] },
  { name = "contact_zone", type = "enum", values = ["head", "face", "shoulder", "arms", "hands", "back", "torso", "legs", "body"], note = "où l'on touche le corps (D10 : avec un mineur, seulement tête, épaule, bras, mains, dos, jambes)" },
]
requires = { target = "graspable" }
uses = ["t_stealth"]
contact = true
party_params = ["target"]
minor_person_ok = true
minor_whitelist = { contact_zone = ["arms", "hands", "back"] }
effects = "la chose passe dans les mains ou sur le dos ; le registre note de quelles mains, par quel geste ; des mains de quelqu'un qui serre : lutte de force"
perceptibility = "vu selon la discrétion, la maîtrise, l'attention des présents ; senti (felt) par celui qu'on dépouille selon la maîtrise"
duration = "un instant"
animation = ["pick_up", "store_crouch", "carry_idle", "carry_walk", "support_walk"]

[[action]]
id = "put"
family = "grasp"
label_fr = "poser, déposer, ranger, cacher, mettre en place (au sol, dans, sur, sous, dans un mur, en terre)"
params = [
  { name = "item", type = "ref", accepts = ["item", "agent", "animal"], note = "un objet ; un corps qu'on porte (le coucher, l'ensevelir)" },
  { name = "where", type = "ref", accepts = ["place", "item", "structure", "terrain", "voxel", "water"] },
  { name = "stealth", type = "enum", values = ["open", "discreet"] },
  { name = "contact_zone", type = "enum", values = ["head", "face", "shoulder", "arms", "hands", "back", "torso", "legs", "body"], note = "où l'on touche le corps (D10 : avec un mineur, seulement tête, épaule, bras, mains, dos, jambes)" },
]
uses = ["t_woodwork", "t_stonework", "t_farming"]
contact = true
party_params = ["item"]
minor_person_ok = true
minor_whitelist = { contact_zone = ["arms", "back"] }
effects = "une pierre dans un mur = assembler (stabilité) ; une graine dans un sol labouré = semer ; sous une pierre = cacher"
perceptibility = "vu selon la discrétion"
duration = "un instant à quelques secondes"
animation = ["put_down", "trowel_place", "store_crouch"]

[[action]]
id = "give"
family = "grasp"
label_fr = "tendre, donner en main propre, nourrir une bête à la main"
params = [
  { name = "item", type = "ref", accepts = ["item"] },
  { name = "to", type = "ref", accepts = ["agent", "animal"] },
  { name = "mode", type = "enum", values = ["offer", "press"], note = "offer : tendre, l'autre prend s'il veut ; press : mettre de force dans la main" },
]
contact = false
effects = "la chose passe de main en main (registre : donné) ; offerte et refusée, elle reste"
perceptibility = "vu"
duration = "un instant"
animation = ["give"]

[[action]]
id = "throw"
family = "grasp"
label_fr = "lancer, jeter, tirer (à la main, à la fronde, à l'arc, à l'arbalète)"
params = [
  { name = "item", type = "ref", accepts = ["item"], note = "le projectile" },
  { name = "at", type = "ref", accepts = ["agent", "animal", "item", "structure", "place", "water", "fire", "voxel", "direction"] },
  { name = "zone", type = "enum", values = ["head", "torso", "arms", "legs", "any"], optional = true },
  { name = "intensity", type = "enum", values = ["faint", "light", "firm", "hard", "full"], ordinal = true },
  { name = "with", type = "ref", accepts = ["item"], optional = true, note = "le lanceur : arc, fronde, arbalète" },
]
requires = { item = "throwable" }
uses = ["t_archery", "t_hunting", "t_fishing"]
contact = false
effects = "projectile ; touche selon la maîtrise, la distance, le vent ; casse ce qui est fragile ; un coup s'il touche quelqu'un (body.toml) ; un filet lancé à l'eau prend du poisson"
perceptibility = "vu ; entendu (claquement, impact)"
duration = "un instant à quelques secondes (viser)"
animation = ["+throw", "+shoot_bow", "fish"]

[[action]]
id = "pour"
family = "grasp"
label_fr = "verser, vider, répandre"
params = [
  { name = "from", type = "ref", accepts = ["item"] },
  { name = "into", type = "ref", accepts = ["item", "place", "terrain", "fire", "agent", "water"] },
  { name = "amount", type = "enum", values = ["little", "some", "all"], ordinal = true },
  { name = "stealth", type = "enum", values = ["open", "discreet"] },
]
requires = { from = "contains" }
contact = false
effects = "le liquide ou la poudre passe (processus couler) ; de l'eau sur un feu l'éteint ; une fiole dans une chope : le mélange"
perceptibility = "vu selon la discrétion et la lumière ; entendu"
duration = "quelques secondes"
animation = ["+pour", "draw_water"]

[[action]]
id = "wear"
family = "grasp"
label_fr = "mettre ou ôter un vêtement, un bijou, un masque, une armure (sur soi ou sur quelqu'un : habiller un enfant, un malade, un mort)"
params = [
  { name = "item", type = "ref", accepts = ["item"] },
  { name = "mode", type = "enum", values = ["put_on", "take_off"] },
  { name = "on", type = "ref", accepts = ["agent"], optional = true, note = "absent : soi-même" },
  { name = "contact_zone", type = "enum", values = ["head", "face", "shoulder", "arms", "hands", "back", "torso", "legs", "body"], note = "où l'on touche le corps (D10 : avec un mineur, seulement tête, épaule, bras, mains, dos, jambes)" },
]
requires = { item = "wearable" }
contact = true
party_params = ["on"]
minor_person_ok = true
minor_whitelist = { mode = ["put_on"], contact_zone = ["head", "shoulder", "arms", "hands", "legs"] }
effects = "change la tenue vue, la protection, l'isolation ; un masque cache le visage (certitude d'identification)"
perceptibility = "vu"
duration = "quelques secondes à une minute de jeu"
animation = ["+change_clothes"]

[[action]]
id = "operate"
family = "grasp"
label_fr = "manœuvrer un mécanisme (ouvrir, fermer, verrouiller, déverrouiller, actionner : porte, coffre, serrure, rouet, métier, cloche, poulie, piège, moulin)"
params = [
  { name = "target", type = "ref", accepts = ["item", "structure"] },
  { name = "mode", type = "enum", values = ["open", "close", "lock", "unlock", "activate"] },
  { name = "with", type = "ref", accepts = ["item"], optional = true, note = "une clé, un crochet de serrurier" },
  { name = "stealth", type = "enum", values = ["open", "discreet"] },
]
uses = ["t_stealth", "t_textile"]
effects = "déverrouille si la clé correspond (de quelle serrure : invisible) ou si la maîtrise vainc la serrure ; activer : rouet, métier, cloche, piège armé ; échoue sans effet si rien ne s'ouvre ni ne se ferme"
perceptibility = "vu ; entendu (grincements, cloche)"
duration = "un instant à longtemps (tisser)"
animation = ["kneel_work", "+use_mechanism"]

# ─── Force ──────────────────────────────────────────────────────────────────────────────────────
[[action]]
id = "strike"
family = "force"
label_fr = "frapper, taper, mordre (une personne, une bête, un arbre, une pierre, un mur, le terrain, du métal chaud)"
params = [
  { name = "target", type = "ref", accepts = ["agent", "animal", "item", "structure", "terrain", "voxel", "plant"] },
  { name = "zone", type = "enum", values = ["head", "torso", "arms", "legs", "any"], note = "la zone fine est tirée par le moteur selon l'adresse" },
  { name = "with", type = "enum", values = ["held", "open_hand", "fist", "foot", "head", "mouth"] },
  { name = "motion", type = "enum", values = ["swing", "thrust"], note = "taille (tranchant, contondant) ou estoc (pointe)" },
  { name = "intensity", type = "enum", values = ["faint", "light", "firm", "hard", "full"], ordinal = true, note = "force du modèle de dommage (body.toml) : faint 1, light 2, firm 4-5, hard 6-7, full 8-10" },
  { name = "until", type = "condition", note = "c_done = une fois ; c_target_down, c_target_still, c_target_yields, c_stopped…" },
]
uses = ["t_fighting", "t_woodwork", "t_stonework", "t_digging", "t_smithing"]
contact = true
party_params = ["target"]
minor_person_ok = true
effects = "énergie = intensité × masse et allonge de ce qui frappe × maîtrise ; sur un corps : dommage par zone (body.toml : taille + tranchant = coupure, estoc + pointe = perforation, sinon contusion ; bouche = morsure) ; sur la matière : fracture, coupe, extraction, forge selon l'outil et la matière ; silex contre fer : étincelles"
perceptibility = "vu, entendu (bruit selon l'impact)"
duration = "un coup ≈ une seconde ; répété jusqu'à la condition"
animation = ["punch", "+slap", "+kick", "swing_axe", "swing_pickaxe", "hammer", "hoe"]
note = "Une gifle = (head, open_hand, swing, light, c_done) ; un coup de poing = (head, fist, swing, firm, c_done) ; un passage à tabac = (any, fist, swing, hard, c_target_yields) ; des coups jusqu'à la mort = (head, foot, swing, full, c_target_still). Un seul geste (D28). D10 ne porte que sur l'intime ; la violence suit les lois du monde."

[[action]]
id = "push"
family = "force"
label_fr = "pousser, bousculer, renverser"
params = [
  { name = "target", type = "ref", accepts = ["agent", "animal", "item", "structure"] },
  { name = "intensity", type = "enum", values = ["faint", "light", "firm", "hard", "full"], ordinal = true },
  { name = "direction", type = "enum", values = ["away", "down", "aside", "into"] },
]
contact = true
party_params = ["target"]
minor_person_ok = true
effects = "déplace, fait tomber (selon force, masse, appuis) ; dans le vide ou l'eau : chute, noyade"
perceptibility = "vu"
duration = "un instant"
animation = ["shove"]

[[action]]
id = "pull"
family = "force"
label_fr = "tirer (quelqu'un par le bras, une charrette, une corde, un filet, une poutre)"
params = [
  { name = "target", type = "ref", accepts = ["agent", "animal", "item", "structure", "voxel"] },
  { name = "intensity", type = "enum", values = ["faint", "light", "firm", "hard", "full"], ordinal = true },
  { name = "toward", type = "ref", accepts = ["place", "direction"], optional = true },
]
contact = true
party_params = ["target"]
minor_person_ok = true
effects = "déplace vers soi ; un filet tiré ramène ce qu'il a pris ; une poutre tirée peut faire tomber ce qu'elle porte"
perceptibility = "vu"
duration = "selon la charge"
animation = ["+pull"]

[[action]]
id = "grab"
family = "force"
label_fr = "saisir quelqu'un (bras, col, cheveux, cou, taille) et le tenir"
params = [
  { name = "target", type = "ref", accepts = ["agent", "animal"] },
  { name = "hold_zone", type = "enum", values = ["arm", "collar", "hair", "neck", "waist"] },
  { name = "intensity", type = "enum", values = ["faint", "light", "firm", "hard", "full"], ordinal = true },
  { name = "until", type = "condition" },
]
uses = ["t_fighting"]
contact = true
party_params = ["target"]
minor_person_ok = true
minor_whitelist = { hold_zone = ["arm", "collar", "hair"] }
effects = "retient (l'autre lutte selon sa force) ; au cou, l'intensité serre le souffle : tenir jusqu'à l'immobilité étrangle"
perceptibility = "vu"
duration = "jusqu'à la condition"
animation = ["grab_restrain"]

[[action]]
id = "guard"
family = "force"
label_fr = "se protéger (parer, esquiver, se couvrir d'un bouclier)"
params = [
  { name = "against", type = "ref", accepts = ["agent", "animal"] },
  { name = "stance", type = "enum", values = ["block", "dodge", "cover"] },
]
uses = ["t_fighting"]
contact = false
effects = "réduit ou évite le prochain coup ; avec ce qui protège, absorbe"
perceptibility = "vu"
duration = "tant qu'on garde"
animation = ["block"]

