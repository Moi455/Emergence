  { name = "target", type = "entity" },
  { name = "with", type = "enum", values = ["hand", "arms", "lips", "forehead", "body"] },
  { name = "zone", type = "enum", values = ["hand", "shoulder", "head", "face", "body"] },
  { name = "manner", type = "enum", values = ["gentle", "firm", "playful", "romantic", "intimate"], intimate_values = ["romantic", "intimate"] },
  { name = "duration", type = "enum", values = ["brief", "a_while", "long"], ordinal = true },
]
effects = "aucun effet écrit : l'autre ressent et juge (son Transformer) ; intimate : jamais montré, fondu au noir (D15), adultes seulement (D10)"
perceptibility = "vu"
duration = "selon le choix"
animation = ["hold_hands", "embrace", "kiss", "lean_in", "support_walk"]

# ─── Percevoir ──────────────────────────────────────────────────────────────────────────────────
[[action]]
id = "look"
family = "perceive"
label_fr = "regarder, observer, fixer, guetter"
params = [{ name = "target", type = "entity" }, { name = "manner", type = "enum", values = ["glance", "watch", "stare", "discreet"] }]
effects = "met la cible au centre de l'attention : perception plus fine, souvenir plus net ; fixer se voit"
perceptibility = "vu (le regard)"
duration = "selon le choix"
animation = ["look_around", "idle"]

[[action]]
id = "listen"
family = "perceive"
label_fr = "écouter, tendre l'oreille, épier"
params = [{ name = "target", type = "entity", optional = true }, { name = "manner", type = "enum", values = ["open", "discreet"] }]
uses = ["t_stealth"]
effects = "entend plus loin et plus bas ; discret derrière ce qui cache : épier"
perceptibility = "vu si l'on n'est pas caché"
duration = "selon le choix"
animation = ["listen"]

[[action]]
id = "search"
family = "perceive"
label_fr = "fouiller, chercher (une pièce, un coffre, un tas, quelqu'un)"
params = [{ name = "target", type = "entity" }, { name = "thoroughness", type = "enum", values = ["quick", "careful", "thorough"], ordinal = true }]
uses = ["t_foraging", "t_hunting"]
effects = "révèle ce qui est caché selon le soin et la maîtrise ; laisse des traces de fouille"
perceptibility = "vu, entendu"
duration = "selon le soin"
animation = ["search_bend"]

[[action]]
id = "examine"
family = "perceive"
label_fr = "examiner de près (tâter un pouls, mordre une pièce, soupeser, sentir, goûter, lire des traces)"
params = [{ name = "target", type = "entity" }, { name = "how", type = "enum", values = ["look", "touch", "weigh", "smell", "taste"] }]
uses = ["t_healing", "t_foraging", "t_hunting", "t_reckoning", "t_smithing"]
effects = "le moteur révèle ce que ce sens peut révéler à cette maîtrise : vivant ou mort, pièce trop légère, viande gâtée, trace fraîche ; jamais une propriété invisible par nature"
perceptibility = "vu"
duration = "quelques secondes"
animation = ["kneel_tend", "search_bend"]

[[action]]
id = "read"
family = "perceive"
label_fr = "lire"
params = [{ name = "target", type = "item" }]
uses = ["t_literacy"]
effects = "perçoit l'inscription (une expression de la langue) si l'on sait lire ; sinon des signes"
perceptibility = "vu"
duration = "selon la longueur"
animation = ["read_paper"]

# ─── Communiquer ────────────────────────────────────────────────────────────────────────────────
[[action]]
id = "speak"
family = "communicate"
label_fr = "parler (à quelqu'un, à un groupe, à la cantonade, à soi-même)"
params = [
  { name = "to", type = "entity", optional = true, note = "une personne, un groupe présent, personne" },
  { name = "volume", type = "enum", values = ["whisper", "low", "normal", "loud", "shout"], ordinal = true },
  { name = "tone", type = "enum", values = ["warm", "calm", "cold", "angry", "pleading"] },
  { name = "content", type = "expression", note = "une expression de la langue intérieure (étape 13), ≤ 16 symboles, composée par le Transformer" },
]
effects = "les présents à portée l'entendent (volume, bruit ambiant, ouïe) ; leur moteur enregistre « X m'a dit P » ; ce qu'ils en croient, leur Transformer en décide"
perceptibility = "entendu ; vu (lèvres, gestes)"
duration = "selon la longueur"
animation = ["talk_calm", "talk_angry", "talk_pleading", "talk_joyful", "address_crowd"]
note = "Promettre, menacer, mentir, faire chanter, demander en mariage, insulter, flatter : tout est dans le contenu, rien dans le geste (D28)."

[[action]]
id = "sign"
family = "communicate"
label_fr = "faire un signe (montrer du doigt, hocher, secouer la tête, saluer, faire signe de venir, hausser les épaules, s'incliner, applaudir, geste grossier, lever la main)"
params = [
  { name = "kind", type = "enum", values = ["point", "nod", "shake_head", "wave", "beckon", "shrug", "bow", "applaud", "rude", "raise_hand"] },
  { name = "at", type = "entity", optional = true },
]
effects = "aucun effet écrit : ceux qui le voient le comprennent selon ce qu'ils croient des usages"
perceptibility = "vu"
duration = "un instant"
animation = ["point", "nod", "shake_head", "wave", "raise_hand"]

[[action]]
id = "write"
family = "communicate"
label_fr = "écrire, graver (une lettre, un billet, une enseigne, un registre, un mot à la craie sur un mur)"
params = [
  { name = "on", type = "item" },
  { name = "content", type = "expression" },
  { name = "signature", type = "enum", values = ["own", "none", "other"], note = "other : signer d'un autre nom, c'est-à-dire un faux" },
]
requires = ["writable"]
uses = ["t_literacy"]
effects = "crée une inscription ; l'auteur réel est noté par le moteur seul ; une écriture se reconnaît (ou non)"
perceptibility = "vu"
duration = "selon la longueur"
animation = ["write"]

[[action]]
id = "perform"
family = "communicate"
label_fr = "chanter, jouer d'un instrument, danser, raconter une histoire à voix haute"
params = [
  { name = "with", type = "item", optional = true, note = "un instrument ; rien : la voix ou le corps" },
  { name = "mood", type = "enum", values = ["joyful", "sad", "solemn", "lively", "eerie"] },
  { name = "content", type = "expression", optional = true, note = "les paroles d'un chant, l'histoire racontée" },
]
uses = ["t_music"]
effects = "s'entend loin ; la qualité suit la maîtrise ; les auditeurs en jugent"
perceptibility = "entendu, vu"
duration = "selon le choix"
animation = ["dance", "tell_story", "+play_instrument"]

# ─── Méta ───────────────────────────────────────────────────────────────────────────────────────
[[action]]
id = "wait"
family = "meta"
label_fr = "attendre (rester, ne rien faire, guetter un moment)"
params = [{ name = "until", type = "condition", note = "une condition de la liste (arrivée de quelqu'un, une heure, un bruit) ou une durée" }]
effects = "rien ; ne rien faire est aussi un comportement observable (charte § 20)"
perceptibility = "vu"
duration = "jusqu'à la condition"
animation = ["idle", "sit_idle"]

[[action]]
id = "stop"
family = "meta"
label_fr = "s'arrêter, interrompre ce qu'on fait"
params = []
effects = "interrompt l'intention en cours ; le PNJ repasse au Transformer"
perceptibility = "vu"
duration = "un instant"
animation = ["idle"]
