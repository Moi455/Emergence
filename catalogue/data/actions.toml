# ─── Transformer ────────────────────────────────────────────────────────────────────────────────
[[action]]
id = "shape"
family = "transform"
label_fr = "façonner à la main une matière malléable (argile, cire, pâte, neige)"
params = [
  { name = "target", type = "ref", accepts = ["item", "terrain"] },
  { name = "into", type = "ref", accepts = ["belief", "form"], note = "une recette crue (knows_how, recipe) ou une forme de forms.toml ; un objet jamais vu peut en sortir" },
  { name = "intensity", type = "enum", values = ["faint", "light", "firm", "hard", "full"], ordinal = true, note = "le soin mis à l'ouvrage" },
]
uses = ["t_pottery", "t_cooking"]
effects = "la qualité suit la maîtrise et le soin ; le métal se forge au marteau (strike sur métal chaud)"
perceptibility = "vu"
duration = "minutes à heures de jeu"
animation = ["kneel_work"]

[[action]]
id = "channel"
family = "transform"
label_fr = "manier une baguette sur la matière (assembler, désassembler, réparer, façonner)"
params = [
  { name = "target", type = "ref", accepts = ["item", "structure", "terrain", "voxel"] },
  { name = "intent", type = "enum", values = ["assemble", "disassemble", "mend", "shape"] },
  { name = "intensity", type = "enum", values = ["faint", "light", "firm", "hard", "full"], ordinal = true, note = "la puissance demandée" },
  { name = "into", type = "ref", accepts = ["belief", "form"], optional = true },
]
requires = { held = "shapes_matter" }
uses = ["t_magic"]
effects = "processus magic_shape : transforme des matières présentes sans en créer ; consomme la charge ; au-delà de la maîtrise : échec, accident, baguette qui éclate (magic_stability)"
perceptibility = "vu (lueur), entendu"
duration = "secondes à minutes de jeu"
animation = ["+channel_wand"]

# ─── Le corps ───────────────────────────────────────────────────────────────────────────────────
[[action]]
id = "eat"
family = "consume"
label_fr = "manger, ou faire manger (un enfant, un malade, une bête)"
params = [
  { name = "item", type = "ref", accepts = ["item", "plant"] },
  { name = "amount", type = "enum", values = ["little", "some", "all"], ordinal = true },
  { name = "to", type = "ref", accepts = ["agent", "animal"], optional = true, note = "absent : soi-même" },
]
contact = false
effects = "faim et réserves selon la nutrition (invisible) ; la toxicité agit ; goûter dit à peu près si c'est gâté"
perceptibility = "vu"
duration = "selon la quantité"
animation = ["eat"]

[[action]]
id = "drink"
family = "consume"
label_fr = "boire, ou faire boire"
params = [
  { name = "item", type = "ref", accepts = ["item", "water"] },
  { name = "amount", type = "enum", values = ["little", "some", "all"], ordinal = true },
  { name = "to", type = "ref", accepts = ["agent", "animal"], optional = true },
]
requires = { item = "contains" }
contact = false
effects = "soif ; ivresse ou poison selon ce qu'il y a dedans"
perceptibility = "vu"
duration = "quelques secondes"
animation = ["drink"]

[[action]]
id = "sleep"
family = "consume"
label_fr = "dormir"
params = [
  { name = "where", type = "ref", accepts = ["place", "item", "structure", "terrain"] },
  { name = "until", type = "condition", note = "reposé, l'aube (heure ressentie), réveillé" },
]
effects = "rembourse le besoin de sommeil ; on perçoit à peine ce qui se passe (un bruit fort réveille)"
perceptibility = "vu"
duration = "selon la dette de sommeil"
animation = ["lie_down", "sleep", "get_up"]

[[action]]
id = "rest"
family = "consume"
label_fr = "se reposer, souffler"
params = [{ name = "duration", type = "enum", values = ["brief", "a_while", "long"], ordinal = true }]
effects = "l'épuisement baisse"
perceptibility = "vu"
duration = "selon le choix"
animation = ["sit_idle"]

[[action]]
id = "touch"
family = "care"
label_fr = "toucher quelqu'un (tapoter l'épaule, prendre la main, serrer dans ses bras, caresser une bête, embrasser)"
params = [
  { name = "target", type = "ref", accepts = ["agent", "animal"] },
  { name = "with", type = "enum", values = ["hand", "arms", "lips", "forehead", "body"] },
  { name = "contact_zone", type = "enum", values = ["head", "face", "shoulder", "arms", "hands", "back", "torso", "legs", "body"] },
  { name = "manner", type = "enum", values = ["gentle", "firm", "playful", "romantic", "intimate"], intimate_values = ["romantic", "intimate"] },
  { name = "duration", type = "enum", values = ["brief", "a_while", "long"], ordinal = true },
]
contact = true
party_params = ["target"]
minor_person_ok = true
minor_whitelist = { with = ["hand", "arms"], contact_zone = ["head", "shoulder", "arms", "hands", "back"], manner = ["gentle", "firm", "playful"] }
effects = "aucun effet écrit : l'autre ressent et juge (son Transformer) ; intimate : jamais montré, fondu au noir (D15), adultes seulement (D10)"
perceptibility = "vu"
duration = "selon le choix"
animation = ["hold_hands", "embrace", "kiss", "lean_in"]
note = "Avec un mineur, seules les valeurs de minor_whitelist passent : tenir la main, serrer dans ses bras, toucher l'épaule ou la tête, doucement ou en jouant."

# ─── Percevoir ──────────────────────────────────────────────────────────────────────────────────
[[action]]
id = "look"
family = "perceive"
label_fr = "regarder, observer, fixer, guetter"
params = [
  { name = "target", type = "ref", accepts = ["agent", "animal", "item", "structure", "terrain", "water", "fire", "place", "trace", "direction"] },
  { name = "mode", type = "enum", values = ["glance", "watch", "stare"], ordinal = true },
  { name = "stealth", type = "enum", values = ["open", "discreet"] },
]
contact = false
effects = "met la cible au centre de l'attention : perception plus fine, souvenir plus net ; fixer se voit"
perceptibility = "vu (le regard)"
duration = "selon le choix"
animation = ["look_around", "idle"]

[[action]]
id = "listen"
family = "perceive"
label_fr = "écouter, tendre l'oreille, épier"
params = [
  { name = "target", type = "ref", accepts = ["agent", "place", "direction"], optional = true },
  { name = "stealth", type = "enum", values = ["open", "discreet"] },
]
uses = ["t_stealth"]
contact = false
effects = "entend plus loin et plus bas ; discret derrière ce qui cache : épier"
perceptibility = "vu si l'on n'est pas caché"
duration = "selon le choix"
animation = ["listen"]

[[action]]
id = "search"
family = "perceive"
label_fr = "fouiller, chercher (une pièce, un coffre, un tas, un champ, quelqu'un)"
params = [
  { name = "target", type = "ref", accepts = ["place", "item", "agent", "structure", "terrain", "trace", "water"] },
  { name = "thoroughness", type = "enum", values = ["brief", "a_while", "long"], ordinal = true },
]
uses = ["t_foraging", "t_hunting", "t_stealth"]
contact = true
party_params = ["target"]
minor_person_ok = false
effects = "révèle ce qui est caché selon le soin et la maîtrise ; laisse des traces de fouille"
perceptibility = "vu, entendu"
duration = "selon le soin"
animation = ["search_bend"]

[[action]]
id = "examine"
family = "perceive"
label_fr = "examiner de près (tâter un pouls, mordre une pièce, soupeser, sentir, goûter, lire des traces)"
params = [
  { name = "target", type = "ref", accepts = ["agent", "animal", "item", "structure", "terrain", "voxel", "water", "trace", "plant"] },
  { name = "sense", type = "enum", values = ["look", "touch", "weigh", "smell", "taste"] },
  { name = "contact_zone", type = "enum", values = ["head", "face", "shoulder", "arms", "hands", "back", "torso", "legs", "body"], note = "où l'on touche le corps (D10 : avec un mineur, seulement tête, épaule, bras, mains, dos, jambes)" },
]
uses = ["t_healing", "t_foraging", "t_hunting", "t_reckoning", "t_smithing"]
contact = true
party_params = ["target"]
minor_person_ok = true
minor_whitelist = { sense = ["look", "touch", "smell"], contact_zone = ["head", "shoulder", "arms", "hands", "back", "legs"] }
effects = "le moteur révèle ce que ce sens peut révéler à cette maîtrise : vivant ou mort, pièce trop légère, viande gâtée, trace fraîche, serrure fermée ; jamais une propriété invisible par nature"
perceptibility = "vu"
duration = "quelques secondes"
animation = ["kneel_tend", "search_bend"]

[[action]]
id = "read"
family = "perceive"
label_fr = "lire"
params = [{ name = "target", type = "ref", accepts = ["item", "structure"] }]
uses = ["t_literacy"]
effects = "perçoit l'inscription (une expression de la langue) si l'on sait lire ; sinon des signes"
perceptibility = "vu"
duration = "selon la longueur"
animation = ["read_paper"]

# ─── Communiquer ────────────────────────────────────────────────────────────────────────────────
[[action]]
id = "speak"
family = "communicate"
label_fr = "parler (à quelqu'un, à un groupe, à une bête, à la cantonade, à soi-même)"
params = [
  { name = "to", type = "ref", accepts = ["agent", "group", "animal"], optional = true },
  { name = "volume", type = "enum", values = ["whisper", "low", "normal", "loud", "shout"], ordinal = true },
  { name = "tone", type = "enum", values = ["warm", "calm", "cold", "angry", "pleading"] },
  { name = "content", type = "expression", note = "une expression de la langue intérieure (≤ 20 symboles), composée par le Transformer" },
]
contact = false
effects = "les présents à portée l'entendent (volume, bruit ambiant, ouïe) ; leur moteur note « X m'a dit P » ; ce qu'ils en croient, leur Transformer en décide"
perceptibility = "entendu ; vu (lèvres, gestes)"
duration = "selon la longueur"
animation = ["talk_calm", "talk_angry", "talk_pleading", "talk_joyful", "address_crowd", "pray"]
note = "Promettre, menacer, mentir, faire chanter, demander en mariage, insulter, flatter, prier : tout est dans le contenu et à qui l'on parle, rien dans le geste (D28)."

[[action]]
id = "sign"
family = "communicate"
label_fr = "faire un signe, décrit par sa forme (montrer du doigt, hocher, secouer la tête, saluer de la main, faire signe de venir, hausser les épaules, s'incliner, applaudir, lever la main, montrer ce qu'on tient, cracher, lever le poing)"
params = [
  { name = "kind", type = "enum", values = ["point", "nod", "shake_head", "wave", "beckon", "shrug", "bow", "applaud", "raise_hand", "show", "spit", "fist"] },
  { name = "at", type = "ref", accepts = ["agent", "animal", "item", "place", "direction", "group"], optional = true },
]
contact = false
effects = "aucun effet écrit : ceux qui le voient le comprennent selon ce qu'ils croient des usages"
perceptibility = "vu"
duration = "un instant"
animation = ["point", "nod", "shake_head", "wave", "raise_hand"]

[[action]]
id = "write"
family = "communicate"
label_fr = "écrire, graver (une lettre, un billet, une enseigne, un registre, un mot à la craie sur un mur)"
params = [
  { name = "on", type = "ref", accepts = ["item", "structure"] },
  { name = "content", type = "expression", note = "le nom de l'auteur, vrai, absent ou d'un autre, fait partie du contenu" },
]
requires = { on = "writable" }
uses = ["t_literacy"]
effects = "crée une inscription ; l'auteur réel est noté par le moteur seul ; une écriture se reconnaît (ou non)"
perceptibility = "vu"
duration = "selon la longueur"
animation = ["write"]

[[action]]
id = "perform"
family = "communicate"
label_fr = "chanter, jouer d'un instrument, danser (les paroles d'un chant passent par speak)"
params = [
  { name = "with", type = "ref", accepts = ["item"], optional = true, note = "un instrument ; absent : la voix ou le corps" },
  { name = "mood", type = "enum", values = ["joyful", "sad", "solemn", "lively", "eerie"] },
  { name = "duration", type = "enum", values = ["brief", "a_while", "long"], ordinal = true },
]
uses = ["t_music"]
effects = "s'entend loin ; la qualité suit la maîtrise ; les auditeurs en jugent"
perceptibility = "entendu, vu"
duration = "selon le choix"
animation = ["dance", "tell_story", "+play_instrument", "mourn"]

# ─── Méta ───────────────────────────────────────────────────────────────────────────────────────
[[action]]
id = "wait"
family = "meta"
label_fr = "attendre (rester, ne rien faire, guetter)"
params = [{ name = "until", type = "condition" }]
effects = "rien ; ne rien faire est aussi un comportement observable (charte § 20)"
perceptibility = "vu"
duration = "jusqu'à la condition"
animation = ["idle", "sit_idle"]

[[action]]
id = "stop"
family = "meta"
label_fr = "s'arrêter, interrompre ce qu'on fait"
params = []
effects = "interrompt l'intention en cours ; le PNJ repasse au Transformer"
perceptibility = "vu"
duration = "un instant"
animation = ["idle"]
