family = "transform"
label_fr = "manier une baguette sur la matière (assembler, désassembler, réparer, façonner)"
params = [
  { name = "target", type = "entity", note = "un tas de matériaux, une construction, un objet" },
  { name = "intent", type = "enum", values = ["assemble", "disassemble", "mend", "shape"] },
  { name = "power", type = "enum", values = ["faint", "low", "medium", "high", "full"], ordinal = true },
  { name = "into", type = "kind", optional = true },
]
