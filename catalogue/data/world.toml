# world.toml - étape 11 : le monde vivant (temps, météo, lumière, eau, feu, sol, structures,
# plantes, animaux, phénomènes, lieux, marches). Tout est écrit par le MOTEUR : ce sont des lois.
#
# Calendrier (décision de Monsieur, 9 oct., D30) :
#   - 1 jour = 1 h 30 réelle : 1 h de jour, 30 min de nuit (aube et crépuscule compris) ;
#   - 1 an = 7 h réelles ≈ 4 jours ⅔ ; une saison = 1 h 45 ≈ 1 jour et quart (la saison change en
#     cours de journée : le temps qu'il fait glisse progressivement) ;
#   - une vie ≈ 150 h (charte § 25) ≈ 21 années de calendrier : le vieillissement suit une HORLOGE DE
#     VIE séparée du calendrier (life_clock), compressée en enfance, accélérée en vieillesse :
#       enfance 0-14 ans d'âge : ≈ 15 h ; adolescence 14-18 : ≈ 6 h ; âge adulte 18-60 : ≈ 105 h
#       (≈ 2 h 30 par année d'âge, soit ≈ 2,8 années d'âge par année de calendrier) ; vieillesse ≈ 24 h.
#   Vérification (charte § 3) : un enfant de 7 ans retrouvé 5 ans plus tard (35 h) a ≈ 26 ans.
#   L'âge qu'on dit (« il a 30 ans ») est l'âge de vie ; l'année du calendrier sert aux saisons, aux
#   fêtes, aux récoltes, à la chronique.
# Budget de l'IA : le PNJ ne voit le monde que par sa perception (étape 12 : jetons PLACE, THING,
# DANGER) ; ici, le champ token dit ce que la perception en tire.

variable = [
