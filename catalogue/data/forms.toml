# forms.toml - les formes de parties : la grammaire des objets.
#
# Un objet = des parties ; une partie = une FORME faite d'une MATIÈRE (« lame:fer », « manche:chêne »).
# Ses propriétés se déduisent : une lame de fer coupe mieux qu'une lame de silex et casse moins ; une
# lame de verre coupe mais casse. Une forme donne une propriété POSSIBLE ; sa force dépend de la
# matière (dureté, ténacité, densité) et de la taille. Toute combinaison est permise par le moteur :
# un couteau attaché au bout d'un bâton est une lance, même si personne ne l'avait prévue.
#
# Axes parcourus : couper/percer/frapper ; tenir/allonger ; contenir/fermer ; couvrir/porter/protéger ;
# attacher/assembler ; rouler/flotter ; supporter ; tendre/lancer ; faire du son/de la lumière ;
# mesurer/ouvrir ; matière sans forme (bloc, morceau, poudre, liquide) ; vivant (organe d'une plante).

