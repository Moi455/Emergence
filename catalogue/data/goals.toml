# goals.toml - étape 9 : objectifs, intention en cours, demandes reçues, accords.
#
# Un OBJECTIF = une proposition qu'on veut rendre vraie, garder vraie ou empêcher (charte § 9).
# Les objectifs de la charte ne sont que des propositions, pas une liste fermée :
#   économiser pour une maison = owns(moi, maison) ; séduire = attitude(X, attraction, moi, haut) ;
#   se venger = feels(X, pain…) ou dead(X) ou has_trait(X, coupable) cru de tous ; quitter le village =
#   lives_at(moi, ailleurs) ; apprendre un métier = knows_how(moi, forge) ; s'enrichir = amount(mes
#   biens, beaucoup) ; une fonction = holds(moi, chef) ; retrouver quelqu'un = at(frère, lieu connu).
# L'INTENTION = la suite de gestes choisie pour avancer (charte § 8 : une action ou une séquence) ;
# interrompue quand la perception change, elle repasse au Transformer.
# Un ACCORD naît de deux paroles (proposer, accepter) : le moteur l'enregistre comme un fait (qui,
# quoi, quand, devant qui) et constate s'il est tenu, échu, rompu. Ce qu'on en pense (trahison ?
# excuse valable ?) appartient aux personnes. Mariage, prêt, emploi, apprentissage, serment, garde
# d'une maison : tous des accords, aucun n'est une action dédiée.
# Règle dure (D10) : le gouverneur refuse tout objectif romantique ou intime envers un mineur, et
# tout accord de mariage impliquant un mineur.
# Budget de l'IA : ≤ 4 jetons GOAL, 1 jeton PLAN, ≤ 2 jetons REQUEST, ≤ 3 jetons COMMIT par décision.

variable = [
  # ─── Objectif ───
  { id = "g_desired", label_fr = "ce qu'on veut (proposition)", holder = "goal", scale = "proposition", writer = ["T_jump"], dynamics = "créé, réorienté (autre cible) ou abandonné par le Transformer ; au plus 8 gardés", token = "GOAL.prop" },
  { id = "g_mode", label_fr = "rendre vrai, garder vrai, empêcher", holder = "goal", scale = "enum", values_from = "goal_mode", writer = ["T_jump"], token = "GOAL.mode" },
  { id = "g_priority", label_fr = "priorité", holder = "goal", scale = "unipolar10", writer = ["T_step"], step = 1.0, rate = 3.0, token = "GOAL.priority" },
  { id = "g_deadline", label_fr = "échéance (avant la fête, avant l'hiver…)", holder = "goal", scale = "time", writer = ["T_jump", "engine"], dynamics = "le moteur la reprend d'un accord quand l'objectif vient d'un accord", token = "GOAL.deadline" },
  { id = "g_origin", label_fr = "d'où vient l'objectif (de soi, d'une demande, d'un rôle, d'un accord, d'une norme)", holder = "goal", scale = "enum", values = ["self", "asked", "role", "agreement", "norm"], writer = ["T_jump", "engine"], token = "GOAL.origin" },
  { id = "g_origin_ref", label_fr = "qui l'a demandé, quel accord, quel rôle", holder = "goal", scale = "id", writer = ["engine", "T_jump"], token = "GOAL.origin_ref (pointeur)" },
  { id = "g_status", label_fr = "état (actif, en pause, atteint, échoué, abandonné)", holder = "goal", scale = "enum", values = ["active", "paused", "achieved", "failed", "abandoned"], writer = ["T_jump", "engine"], dynamics = "le Transformer met en pause, reprend, abandonne ; le moteur constate atteint ou échoué d'après les CROYANCES de la personne, jamais d'après la vérité (un mort qu'elle n'a pas appris reste à venger)", token = "GOAL.status" },
  { id = "g_progress", label_fr = "avancement (quand il se mesure : pièces économisées / prix cru de la maison)", holder = "goal", scale = "ratio", writer = ["derived"], token = "GOAL.progress" },
  { id = "g_since", label_fr = "depuis quand", holder = "goal", scale = "time", writer = ["engine"], token = "GOAL.age" },
  # ─── Intention en cours ───
  { id = "i_steps", label_fr = "la suite de gestes choisie (1 à 6), chacun avec ses conditions d'arrêt et d'interruption", holder = "intention", scale = "list", writer = ["T_jump"], dynamics = "gestes et conditions de l'étape 12 ; le moteur l'exécute seul jusqu'à la fin, l'échec ou l'interruption", token = "PLAN" },
  { id = "i_serves", label_fr = "l'objectif qu'elle sert", holder = "intention", scale = "id", writer = ["T_jump"], token = "PLAN.goal (pointeur)" },
  { id = "i_step_index", label_fr = "étape en cours, progression", holder = "intention", scale = "qty", writer = ["engine"], token = "PLAN.progress" },
  { id = "i_commitment", label_fr = "fermeté (résister aux interruptions mineures)", holder = "intention", scale = "unipolar10", writer = ["T_jump"], dynamics = "haute : seul un vrai danger interrompt ; basse : la moindre chose détourne", token = "PLAN.commitment" },
  # ─── Demande reçue ───
  { id = "q_from", label_fr = "qui demande", holder = "request", scale = "id", writer = ["engine"], token = "REQUEST.from (pointeur)" },
  { id = "q_content", label_fr = "ce qui est demandé (proposition : « que tu viennes te promener en forêt »)", holder = "request", scale = "proposition", writer = ["engine"], token = "REQUEST.prop" },
  { id = "q_since", label_fr = "depuis quand on attend une réponse", holder = "request", scale = "time", writer = ["engine"], dynamics = "ne pas répondre est aussi une réponse (charte § 20) : la demande expire, le demandeur le perçoit", token = "REQUEST.age" },
  # ─── Accord (entité agreement) ───
  { id = "a_parties", label_fr = "les parties", holder = "agreement_terms", scale = "list", writer = ["engine"], dynamics = "ceux qui ont proposé et accepté", visibility = "engine" },
  { id = "a_obligations", label_fr = "qui doit rendre vrai quoi, avant quand, à quelle condition, une fois ou à chaque période (chaque mois), et la part déjà remplie", holder = "agreement_terms", scale = "list", writer = ["engine"], visibility = "engine", dynamics = "repris tel quel de la proposition acceptée (expression de la langue)" },
  { id = "a_witnesses", label_fr = "les témoins", holder = "agreement_terms", scale = "list", writer = ["engine"], visibility = "engine", dynamics = "ceux qui ont perçu l'échange de paroles, cachés compris ; un accord sans témoin ne se prouve que par la parole" },
  { id = "a_form", label_fr = "forme (dit, devant témoins, écrit, scellé, rituel)", holder = "agreement_terms", scale = "enum", values = ["spoken", "witnessed", "written", "sealed", "ritual"], writer = ["engine"], visibility = "engine", dynamics = "écrit quand une inscription le porte ; scellé si un sceau y est apposé ; rituel si fait selon une coutume crue (noces au temple)" },
  { id = "a_status", label_fr = "état objectif (en cours, tenu, rompu, délié, caduc)", holder = "agreement_terms", scale = "enum", values = ["open", "fulfilled", "broken", "released", "void"], writer = ["engine"], dynamics = "tenu quand les obligations deviennent vraies ; rompu à l'échéance dépassée ou sur refus dit ; délié quand le bénéficiaire le dit ; caduc à la mort d'une partie (que la dette passe aux héritiers est une croyance, pas une règle)", visibility = "engine", note = "Jamais montré : chacun ne connaît que l'état qu'il CROIT (commitments_seen)." },
  { id = "a_document", label_fr = "l'écrit qui le porte, s'il existe", holder = "agreement_terms", scale = "id", writer = ["engine"] },
  { id = "a_kind_label", label_fr = "étiquette pour la chronique (prêt, vente, mariage, emploi, apprentissage, serment, alliance, garde…)", holder = "agreement_terms", scale = "enum", values = ["promise", "loan", "sale", "barter", "employment", "apprenticeship", "marriage", "betrothal", "oath", "alliance", "custody", "other"], writer = ["derived"], visibility = "public", dynamics = "tirée du contenu ; sert à l'affichage, jamais à décider" },
  # ─── Ce que la personne croit de ses accords (le seul accès de l'IA aux accords) ───
  { id = "commitments_seen", label_fr = "ses accords tels qu'elle s'en souvient et les croit : avec qui, qui doit quoi, échéance, tenu ou rompu à ses yeux, devant qui elle croit l'avoir conclu", holder = "goals", scale = "list", writer = ["derived"], dynamics = "tiré de ses souvenirs et de ses croyances (party_to, owes) ; peut différer de l'accord réel", token = "COMMIT (contrepartie, mien ou sien, échéance, état cru, témoins crus)" },
]
