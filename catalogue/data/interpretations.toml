[[interpretation]]
id = "mockery"
label_fr = "moquerie, plaisanterie"
facts = ["an utterance or gesture followed by laughter, about someone present"]
cues = ["laughter", "playful tone", "the target's reaction"]
norms = []

[[interpretation]]
id = "threat_felt"
label_fr = "menace"
facts = ["an utterance conditioning a harm to the hearer on the hearer's act"]
cues = ["if … then harm said to me", "a weapon shown", "an angry tone"]
norms = ["norm(forbidden, force someone by fear)"]

[[interpretation]]
