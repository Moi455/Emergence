cues = ["a coin given to a guard, a judge, a chief", "in secret", "followed by a favour"]
norms = ["norm(forbidden, buy a role holder)"]

[[interpretation]]
id = "fraud"
label_fr = "tromperie, fraude (fausse monnaie, balance faussée, marchandise trompeuse)"
