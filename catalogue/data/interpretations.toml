# interpretations.toml - étape 14 : ce que les témoins CONCLUENT. Jamais une option (D28).
#
# Un PNJ ne « vole » pas : il prend (take), discrètement peut-être, une chose qu'un autre croit à lui.
# Un témoin, lui, peut en conclure « c'est un vol » : il écrit un souvenir dont l'interprétation est
# theft (m_interpretation), ou dit « qualifies(cet événement, theft) ». Deux témoins du même geste
# peuvent conclure différemment (la hache reprise : vol pour le fils, rien pour le père).
#   facts : ce que le moteur enregistre, vrai (pour la chronique et les mesures ; jamais lu par l'IA) ;
#   cues  : ce qu'un témoin peut PERCEVOIR ou CROIRE et qui pointe vers ce jugement ;
#   norms : les croyances de norme qui le rendent saillant (sans elles, le même geste ne choque pas).
# Ces mots servent à juger, à raconter et à accuser ; le validateur refuse qu'un geste en porte le nom.

[[interpretation]]
id = "theft"
label_fr = "vol"
facts = ["custody passed by take, without a give from the previous holder", "the previous holder or a claimant is recognized by others"]
cues = ["take with stealth discreet", "the thing is believed to be another's (owns)", "the holder absent or not looking", "the taker hides it after"]
norms = ["norm(forbidden, take what is another's without their give)"]

[[interpretation]]
id = "taking_back"
label_fr = "reprendre son bien"
facts = ["custody passed by take", "the taker held it earlier and gave it as a loan (agreement)"]
cues = ["the taker is believed to own it", "a loan is remembered"]
norms = ["norm(permitted, take back what one lent)"]

[[interpretation]]
id = "assault"
label_fr = "agression, coups"
facts = ["strike or push or grab on an agent", "harm caused (wounds, pain)"]
cues = ["strike seen", "the target did not strike first", "visible injury"]
norms = ["norm(forbidden, strike someone who did not strike)"]

[[interpretation]]
id = "self_defense"
label_fr = "légitime défense"
facts = ["the target struck or threatened first with a weapon"]
cues = ["the other was seen striking first or holding a blade", "the striker stopped when the other yielded"]
norms = ["norm(permitted, strike to protect oneself or one's own)"]

[[interpretation]]
id = "murder"
label_fr = "meurtre"
facts = ["an agent died of wounds from strikes by another agent"]
cues = ["strikes continued after the target was down or still", "a weapon was used", "the body was hidden"]
norms = ["norm(forbidden, cause someone's death)"]

[[interpretation]]
id = "manslaughter"
label_fr = "mort sans l'avoir voulu (rixe qui tourne mal, accident)"
facts = ["an agent died of wounds from strikes in a brawl, or from an accident caused by another"]
cues = ["a brawl was seen", "the striker stopped and looked shocked", "no weapon"]
norms = ["norm(shameful, cause a death by carelessness)"]

[[interpretation]]
id = "accident"
label_fr = "accident"
facts = ["harm without any agent's gesture aimed at it (a collapse, a fall, a beast)"]
cues = ["nobody was seen acting", "a collapse, a slip, a beast"]
norms = []

[[interpretation]]
id = "lie"
label_fr = "mensonge"
facts = ["the speaker asserted P while holding the belief not-P"]
cues = ["what was said contradicts what one saw or later learned", "involuntary signs while speaking (blush, tremble)", "the speaker gained from it"]
norms = ["norm(forbidden, assert what one believes false)"]

[[interpretation]]
id = "betrayal"
label_fr = "trahison"
facts = ["an agreement or a secret was broken by a party, to the other's harm"]
cues = ["a promise remembered and its breaking seen or learned", "a secret confided and now known by others", "the one trusted sided with an enemy"]
norms = ["norm(forbidden, break one's word)", "norm(forbidden, reveal what was confided)"]

[[interpretation]]
id = "broken_promise"
label_fr = "promesse non tenue"
facts = ["an agreement passed its deadline unfulfilled"]
cues = ["a promise remembered (commitments_seen) and the deadline believed past"]
norms = ["norm(obligatory, do what one promised)"]

[[interpretation]]
id = "adultery"
label_fr = "adultère, infidélité"
facts = ["an adult in a marriage agreement had an intimate touch with another adult"]
cues = ["a romantic or intimate touch seen between one spouse and someone else", "secret meetings"]
norms = ["norm(forbidden, romantic touch outside one's marriage)"]

[[interpretation]]
id = "injustice"
label_fr = "injustice"
facts = ["someone was punished or deprived for an act they did not commit, or more than others for the same act"]
cues = ["the punished is believed innocent", "the punisher is believed partial (kin, bribe)"]
norms = ["norm(forbidden, punish the innocent)", "norm(obligatory, the same rule for all)"]

[[interpretation]]
id = "generosity"
label_fr = "générosité"
facts = ["goods given without any agreement asking for a return"]
cues = ["give seen", "the giver is believed to have little", "in a time of scarcity"]
norms = ["norm(admirable, share in hard times)"]

[[interpretation]]
id = "kindness"
label_fr = "gentillesse, aide"
facts = ["a gesture that reduced another's pain, hunger, danger or work"]
cues = ["help seen", "nothing asked in return"]
norms = ["norm(admirable, help those who need it)"]

[[interpretation]]
id = "rescue"
label_fr = "sauvetage"
facts = ["an agent moved or protected another out of a lethal danger"]
cues = ["someone carried out of a fire or water", "stood between a beast and a child"]
norms = ["norm(admirable, risk oneself for another)"]

[[interpretation]]
id = "cowardice"
label_fr = "lâcheté"
facts = ["an agent moved away from a danger while others nearby were harmed"]
cues = ["go away seen during an attack", "kin or friends left behind"]
norms = ["norm(shameful, abandon one's own in danger)"]

[[interpretation]]
id = "heroism"
label_fr = "héroïsme"
facts = ["an agent faced a lethal danger to protect others"]
cues = ["rescue seen", "the danger was believed great"]
norms = ["norm(admirable, risk oneself for another)"]

[[interpretation]]
id = "insult"
