# body.toml - étape 3 : le corps, les besoins, l'âge, l'apparence, ce qu'on porte.
#
# Tout ici est écrit par le MOTEUR (composants engine_only) : le Transformer choisit des gestes ; la
# physique en fait des blessures, de la fatigue, de la faim. Charte § 29.
#
# Le dommage (référence pour le moteur, pas une décision) :
#   énergie du coup = force du geste × masse et allonge de l'instrument × maîtrise ;
#   type = tranchant (edge) → coupure ; pointe (point) → perforation ; sinon contondant ;
#   gravité = énergie − protection portée sur la zone − robustesse ; une fracture si la gravité
#   dépasse le seuil de l'os de la zone ; la conscience baisse avec les coups à la tête, la douleur
#   et la perte de sang ; la mort vient du sang (< 40 %), d'une zone vitale détruite (tête, torse
#   haut), de l'asphyxie, du froid, de la maladie ou de la faim.
#   Ainsi : une gifle (force 2, main ouverte, tête) = douleur +2, joue rouge, aucun dommage ;
#   un coup de poing (force 5) = douleur, bleu ; un passage à tabac (force 6-8 répétée) = fractures,
#   perte de conscience ; continuer sur un corps inconscient = hémorragie interne, mort. Un seul geste.
#
# Budget de l'IA : elle voit un RÉSUMÉ (champ token). Les 16 zones, le volume de sang, la grossesse
# précoce, la maladie avant les symptômes restent au moteur (visibility = engine).
# Zones = docs/interfaces.md § 4 (masque de 16 bits des vêtements) : la protection d'un vêtement s'applique
# exactement aux zones qu'il couvre.

variable = [
