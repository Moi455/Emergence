# society.toml - étape 10 : la société, qui émerge des individus (charte § 11).
#
# Rien ici n'est une créature autonome. Ce qui est STOCKÉ par le moteur est minimal et objectif :
#   - le référent d'un groupe ou d'un rôle (un nom pour qu'on puisse en parler, qui l'a fondé, quand) ;
#   - la parenté biologique (un fait, qui peut être ignoré ou caché : paternité secrète) ;
#   - la détention des choses (has : qui la tient, où elle est) et les échanges qui ont eu lieu.
# Tout le reste est CROYANCE ou ACCORD, tenu par chacun :
#   propriété (owns), appartenance (member), direction (leads), rôle (holds), pouvoirs (may), lois
#   (norm énoncée par un titulaire), coutumes (custom), réputation (has_trait), prix (worth), valeur
#   de la monnaie (worth d'une pièce).
# Les VUES CALCULÉES (writer derived, visibility engine) servent à la chronique, à l'affichage et
# aux mesures ; elles ne sont JAMAIS dans un jeton : un PNJ ne connaît pas « la légitimité du chef »,
# il connaît ce qu'il en croit et ce qu'il voit les autres faire.
# Un chef est obéi dans la mesure où des gens croient qu'il a le droit de commander ET choisissent
# d'obéir. Un décret ignoré par la moitié du village n'est qu'une parole (histoire decree_ignored).

