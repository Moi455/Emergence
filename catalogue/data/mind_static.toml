# mind_static.toml - étape 4 : l'esprit stable (ce que la personne EST, qui bouge lentement).
#
# Axes complets plutôt qu'une liste inventée :
#   - personnalité : 18 traits tirés du modèle HEXACO (les facettes trop proches fusionnées, revue du 9 oct.) ;
#   - aptitudes : ce qui règle la qualité de la pensée et de la perception (charte § 24 : la profondeur) ;
#   - tempérament : la dynamique des émotions (vitesse, retour au calme, humeur de base) ;
#   - valeurs : ce qui compte pour la personne (fusion des valeurs de Schwartz et des fondements
#     moraux de Haidt), 8 axes qui ne doublent pas un trait ;
#   - attirance et goûts singuliers : attitudes envers n'importe quel concept (les excentriques, § 7).
# Les NORMES précises (« voler est mal », « la fidélité compte », tabou de parenté) ne sont pas ici :
# ce sont des croyances (étape 6), tenues par chacun, transmises, et qui changent avec la société.
#
# Écriture : à la naissance, puis le Transformer les fait évoluer lentement (charte § 6), au plus
# slow_rate par année vécue. Un timide (−6) peut devenir assuré (+4) en dix ans de vie.
# Budget de l'IA : un jeton SELF_MIND (33 dimensions : 18 traits, 5 aptitudes, 2 de tempérament, 8 valeurs ; 32 vues par l'IA, la mémoire restant au moteur ; plus l'attirance et les goûts) ; les autres n'en voient RIEN (charte § 5).
# Fusions (revue du 9 oct., un modèle de 5 M paramètres ne distingue pas des dimensions qui se recouvrent) :
#   assurance = social_self_esteem + social_boldness ; diligence = organization + diligence + perfectionism ;
#   gentleness = gentleness + flexibility ; sentimentality = sentimentality + dependence ;
#   liveliness → baseline_mood ; emotional_reactivity → patience et fearfulness ; aesthetic → creativity ;
#   valeurs retirées car doublant un trait : care (altruism), fairness (fairness), tradition (unconventionality,
#   sanctity), security (fearfulness), adventure (inquisitiveness).

