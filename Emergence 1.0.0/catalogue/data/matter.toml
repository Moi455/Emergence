# ─── Processus (lois de transformation, jamais choisis) ─────────────────────────────────────────
# Séparer
[[process]]
id = "cut"
label_fr = "couper, trancher"
inputs = "matière tendre (bois, chair, tissu, plante, corde)"
conditions = ["cuts"]
effect = "sépare en morceaux selon la force et l'angle ; l'outil s'use ; une carcasse rend ses produits selon l'espèce et la partie (viande, peau, os, corne, plume, graisse) et la maîtrise"
trigger = "contact : un outil qui coupe (cuts) sur une matière tendre"
clock = "game"
nominal_game_s = 0
consumes = []
produces = []

[[process]]
id = "split"
label_fr = "fendre (le bois dans le fil, la pierre litée)"
inputs = "bois, ardoise, calcaire"
conditions = ["impacts", "edge"]
effect = "éclats et planches grossières"
trigger = "contact : outil à tranchant frappé (edge, impacts) dans le fil"
clock = "game"
nominal_game_s = 0
