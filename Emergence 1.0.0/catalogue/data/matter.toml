# ─── Composant : un processus long en cours (T08a, docs/16 4.5) ─────────────────────────────────
[[component]]
id = "transformation"
label_fr = "transformation en cours : où en est un processus lent (bière qui fermente, peau qui tanne, graine qui germe), depuis quand"
holder = "item, structure, plant, terrain"
engine_only = true
note = "Moteur seul, sans canal : aucune de ses variables n'atteint un jeton. Ce qu'on en VOIT passe par l'état apparent (pc_state_seen : trouble, mûr, pourri…)."

[[variable]]
id = "process_progress"
no_law_reason = "world, matter or society variable: law of another task (T18, T23, T34)"
label_fr = "avancement du processus en cours (0 à 1)"
holder = "transformation"
scale = "ratio"
writer = ["engine"]
visibility = "engine"
dynamics = "monte avec l'horloge du processus (nominal_game_s) quand ses conditions tiennent ; se fige ou recule quand elles cessent"
clock = "day"

[[variable]]
id = "process_started_at"
no_law_reason = "world, matter or society variable: law of another task (T18, T23, T34)"
label_fr = "instant de jeu où le processus en cours a commencé"
holder = "transformation"
scale = "time"
writer = ["engine"]
visibility = "engine"
note = "Écrit à la sauvegarde avec process_progress : un processus long survit au rechargement."

