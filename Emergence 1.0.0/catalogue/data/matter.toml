note = "D30 : 43 200 s de jeu = 0,5 jour de jeu = 45 min réelles (nominal avant, 4 jours = 6 h réelles, dépassait la maturité de l'orge, de l'avoine, des fèves, du chou, de l'oignon, de la carotte, du lin et du chanvre : 2 jours, du navet : 1 jour). La germination est la première étape d'une culture : elle doit rester bien en dessous de days_to_mature (species.toml, minimum 1 jour) ; 0,5 jour = une demi-journée de jeu."
consumes = ["grain", "water"]
produces = ["grain"]

[[process]]
id = "separate"
label_fr = "séparer (battre, vanner, tamiser, écrémer, baratter)"
inputs = "mélange de grain et de paille, farine et son, lait"
