effect = "traite, pressoir, égouttage, essorage ; le lait d'une bête suit animal_product_ready"
trigger = "work en pressant ou en serrant ce qui contient un fluide"
clock = "game"
nominal_game_s = 0
consumes = ["vegetable"]
produces = ["oil", "milk"]

