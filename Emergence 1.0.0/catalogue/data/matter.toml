# matter.toml - étape 2 (suite) : matières, processus de transformation, types d'objets.
#
# Matières : les classes de voxels viennent de engine/data/materials.csv (lues, jamais recopiées ;
# numéros figés). Ici : (a) des compléments pour quelques matières du moteur (ténacité, cohésion…),
# (b) des matières PROPOSÉES (num = -1) dont les objets ont besoin ; à ajouter en fin de
# materials.csv par le fil du moteur.
#
# Processus : les LOIS de transformation de la matière, appliquées par le moteur quand leurs
# conditions physiques sont réunies (outil qui coupe, chaleur suffisante, temps écoulé…). Personne ne
# « choisit un processus » : un agent fait des gestes (étape 12), et le processus se produit si la
# physique le permet. Le pain naît de moudre + pétrir + cuire, pas d'une action « faire du pain ».
# Une recette est un SAVOIR (une croyance sur quels gestes produisent quoi), pas une règle du moteur.
#
# Les objets sont des assemblages de parties (forms.toml) ; les types connus sont dans items_*.toml.

