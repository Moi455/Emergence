# ─── Processus (lois de transformation, jamais choisis) ─────────────────────────────────────────
# Séparer
[[process]]
id = "cut"
label_fr = "couper, trancher"
inputs = "matière tendre (bois, chair, tissu, plante, corde)"
conditions = ["cuts"]
effect = "sépare en morceaux selon la force et l'angle ; l'outil s'use"

[[process]]
id = "split"
label_fr = "fendre (le bois dans le fil, la pierre litée)"
inputs = "bois, ardoise, calcaire"
conditions = ["impacts", "edge"]
effect = "éclats et planches grossières"

[[process]]
id = "fracture"
label_fr = "casser, briser"
inputs = "toute matière"
conditions = ["impacts"]
effect = "si l'énergie du choc dépasse la ténacité : morceaux, débris ; sinon l'intégrité baisse ; silex contre fer : des étincelles (qui allument l'amadou)"

[[process]]
id = "crush"
label_fr = "écraser, moudre, broyer"
inputs = "grain, minerai, herbe, os"
conditions = ["impacts"]
effect = "grain → farine ; minerai → minerai broyé ; herbe → pâte"

[[process]]
id = "extract"
label_fr = "extraire (arracher du terrain : creuser, piocher)"
inputs = "terrain"
conditions = ["digs"]
effect = "retire des voxels ; la matière extraite devient objet ; la stabilité voisine change"

[[process]]
id = "till"
label_fr = "labourer, retourner la terre"
inputs = "sol (terrain)"
conditions = ["digs"]
effect = "le sol passe à « labouré » (soil_state) ; l'humidité et la fertilité s'en ressentent ; une houe, une bêche ou un araire tiré par un bœuf"

# Assembler
[[process]]
id = "assemble"
label_fr = "assembler (empiler, emboîter, clouer, maçonner)"
inputs = "pièces de bois, pierres, briques, mortier"
conditions = ["graspable"]
effect = "crée ou agrandit une structure ; la stabilité dépend des appuis"

[[process]]
id = "bind"
label_fr = "lier, nouer, coudre"
inputs = "corde, fil, cuir, tissu"
conditions = ["binds"]
effect = "attache deux choses ; tient tant que la ténacité du lien n'est pas dépassée"

[[process]]
id = "mix"
label_fr = "mélanger, pétrir, dissoudre"
inputs = "farine + eau, argile + eau, teinture + eau, sel + eau"
conditions = ["contains"]
effect = "produit un mélange (pâte, mortier, saumure, bain de teinture)"

[[process]]
id = "spin_weave"
label_fr = "filer et tisser (fibre → fil → étoffe)"
inputs = "laine, lin, chanvre"
effect = "étoffe, dont la qualité suit la maîtrise"

# Façonner
[[process]]
id = "carve"
label_fr = "tailler, sculpter, graver"
inputs = "bois, pierre, os"
conditions = ["cuts"]
effect = "change la forme ; peut produire une inscription"

[[process]]
id = "forge"
label_fr = "forger (déformer le métal chaud par des coups)"
inputs = "métal chaud"
conditions = ["impacts", "heats"]
effect = "outils, lames, clous, serrures ; qualité selon maîtrise, chaleur, outil"

[[process]]
id = "mold_cast"
label_fr = "mouler, couler (argile façonnée, métal fondu dans un moule)"
inputs = "argile humide, métal fondu"
conditions = ["contains"]
effect = "forme imposée par le moule ou la main"

[[process]]
id = "magic_shape"
label_fr = "façonner par magie (bâtir, assembler ou désassembler la matière)"
inputs = "matières présentes"
conditions = ["shapes_matter"]
effect = "transforme des matières disponibles en construction ou objet, sans en créer ; consomme la charge ; échec ou accident si la puissance dépasse la maîtrise"
note = "Charte § 17 : la baguette ne crée rien gratuitement."

# Thermique
[[process]]
id = "heat"
label_fr = "chauffer"
conditions = ["heats"]
effect = "la température monte selon la source, la masse, la conduction ; un frottement long et fort (bois sec contre bois) chauffe jusqu'à la braise"

[[process]]
id = "combust"
label_fr = "brûler"
conditions = ["fuel", "ignites"]
effect = "consomme le combustible, crée un feu qui se propage selon l'inflammabilité, l'humidité, le vent ; produit cendre et fumée"

[[process]]
id = "melt"
label_fr = "fondre"
conditions = ["heats"]
effect = "au-delà du point de fusion, la matière devient fluide"

[[process]]
id = "smelt"
label_fr = "réduire le minerai (bas fourneau)"
inputs = "minerai broyé + charbon"
conditions = ["heats"]
effect = "minerai → métal brut, scories"

[[process]]
id = "fire_clay"
label_fr = "cuire l'argile"
inputs = "argile façonnée sèche"
conditions = ["heats"]
effect = "argile → céramique (pots, tuiles, briques)"

[[process]]
id = "cook"
label_fr = "cuire un aliment"
inputs = "pâte, chair, légumes, grain"
conditions = ["heats"]
effect = "pâte → pain ; chair crue → cuite (plus nourrissante, moins de maladie) ; trop cuit → brûlé"

[[process]]
id = "cool_freeze"
label_fr = "refroidir, geler"
effect = "la température baisse vers celle du lieu ; l'eau gèle sous 0 °C"

# Chimique et vivant
[[process]]
id = "ferment"
label_fr = "fermenter"
inputs = "grain, fruit, lait + eau, dans un récipient fermé"
conditions = ["contains"]
effect = "bière, vin, fromage, après des jours"

[[process]]
id = "rot"
label_fr = "pourrir, se gâter"
effect = "la fraîcheur baisse ; à zéro, l'aliment devient toxique ; le bois mouillé perd son intégrité"

[[process]]
id = "dry_preserve"
label_fr = "sécher, saler, fumer (conserver)"
inputs = "chair, poisson, herbe, grain"
effect = "la fraîcheur baisse beaucoup plus lentement"

[[process]]
id = "tan"
label_fr = "tanner"
inputs = "peau + écorce + eau"
effect = "peau → cuir, après des jours"

[[process]]
id = "dye_process"
label_fr = "teindre"
inputs = "étoffe + bain de teinture"
effect = "change la teinte"

[[process]]
id = "heal_tissue"
label_fr = "cicatriser"
effect = "les blessures se referment avec le temps, plus vite si propres, soignées et au repos ; l'infection les aggrave"

[[process]]
id = "wear"
label_fr = "s'user"
effect = "l'usage et le temps baissent l'intégrité et la qualité ; le fer rouille à l'humidité"

[[process]]
id = "grow"
label_fr = "pousser, mûrir, se reproduire (plantes, animaux)"
effect = "selon saison, eau, sol, lumière ; les graines tombent, les troupeaux s'agrandissent"

# Fluides
[[process]]
id = "flow"
label_fr = "couler, s'écouler"
effect = "un liquide versé ou libéré descend et s'étale ; un seau renversé mouille"

[[process]]
id = "absorb_evaporate"
label_fr = "absorber, s'évaporer"
effect = "le sol boit l'eau, la chaleur l'évapore ; un puits se remplit par la nappe"
