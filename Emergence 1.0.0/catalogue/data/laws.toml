# laws.toml - T21b : les LOIS du corps et de l'esprit, appliquées par le moteur à chaque pas (docs/14, ETAT.md T21).
#
# Principe de Monsieur : « tout doit être rendu possible par des variables ». Les taux, demi-vies, fractions et seuils
# des lois ne sont plus dans le code C++ : ils sont ICI, et `gen_cpp.py` les écrit dans `laws_gen.h` (kLaws[]) que
# `engine/social/src/npc_laws.cpp` lit. Seuls les paramètres de physique et de temps (WorldClock : 1 s réelle = 16 s de jeu,
# jour, année calendaire ; LifeClock : bornes des âges) restent des constantes de code, documentées.
#
# Une loi (`[[law]]`) :
#   id          nom de la loi (unique) ;
#   variables   les variables que la loi ÉCRIT (une variable `engine` a une loi OU un `no_law_reason`, jamais les deux) ;
#   form        rate (taux par heure de jeu) | relax (retour d'ordre 1, constante de temps) | halflife (demi-vie) |
#               derived (calculée de l'état) | threshold (seuil) | fade (extinction lente vers 0) ;
#   basis       "physics" (la nature : refroidissement, saignement...) ou "design" (réglage de rythme du jeu, D30) : OBLIGATOIRE ;
#   unit        l'unité des paramètres ; params : des ENTIERS, le nom dit l'unité quand c'est une durée
#               (..._real_s, ..._game_s, ..._game_h, ..._game_days, ..._years), les rapports sont en millièmes (_permille) ;
#   by_exertion les 6 valeurs selon l'effort (sleeping, lying_awake, standing, walking, running, heavy_work) ;
#   depends_on  les FAITS OBJECTIFS lus (jamais une variable privée, jamais une vérité interdite aux jetons : check.py) ;
#   reads       l'état propre du PNJ lu (traits, émotions, besoins, douleur) : jamais une vérité interdite aux jetons ;
#   doc_ref     où c'est décidé. Aucune loi ne réagit à un événement : le modèle fait SAUTER les émotions, le moteur les ramène.
#
# Rythme de D30 : environ trois repas et un sommeil de 8 h par jour de jeu (16 h de jour, 8 h de nuit). Les taux sont en
# millièmes d'unité stockée par heure de jeu (les variables 0..10 sont stockées en dixièmes : 9 000 = 0,9 point par heure).

# ---- le corps : besoins ------------------------------------------------------------------------------------------------
[[law]]
id = "hunger_rise"
variables = ["hunger"]
form = "rate"
basis = "design"
unit = "millièmes d'unité par heure de jeu"
by_exertion = [2000, 3500, 4500, 9000, 14000, 11000]
params = { load_divisor = 4 }
doc_ref = "docs/14 ; ETAT.md T21"
label_fr = "la faim monte avec le temps, l'effort et la charge"
note = "rises with time, effort, load (permille of load / load_divisor added when walking or running); falls only by eating (action)"

[[law]]
id = "thirst_rise"
variables = ["thirst"]
form = "rate"
basis = "design"
unit = "millièmes d'unité par heure de jeu"
by_exertion = [4000, 8000, 9000, 16000, 26000, 20000]
params = { hot_above_milli_c = 25000, hot_permille_per_degree = 50, hot_max_permille = 2000 }
depends_on = ["air_temperature"]
doc_ref = "docs/14 ; ETAT.md T21"
label_fr = "la soif monte plus vite par chaleur et à l'effort"
note = "rises faster in the heat and with the effort; falls only by drinking (action)"

[[law]]
id = "reserves_fast"
variables = ["reserves"]
form = "rate"
basis = "design"
unit = "millièmes d'unité par heure de jeu ; seuils en unités stockées (dixièmes)"
params = { famine_hunger = 80, fed_hunger = 40, thirst_critical = 90, fall_rate = 1667, rise_rate = 833 }
reads = ["hunger", "thirst"]
doc_ref = "docs/14 ; ETAT.md T21"
label_fr = "les réserves du corps fondent à jeun, se refont rassasié"
note = "falls in prolonged fasting (4 points per game day), rises when fed (2 points per game day)"

[[law]]
id = "exhaustion_relax"
variables = ["exhaustion"]
form = "relax"
basis = "design"
unit = "cible en dixièmes selon l'effort ; constantes de temps en s de jeu ; rapports en millièmes"
by_exertion = [0, 0, 5, 50, 95, 70]
params = { rise_tau_game_h = 1, fall_tau_game_s = 1800, load_divisor = 20, endurance_base_permille = 1400, endurance_per_point_permille = 6 }
reads = ["endurance"]
doc_ref = "docs/14 ; ETAT.md T21"
label_fr = "la fatigue suit l'effort, plus vite vers le bas que vers le haut"
note = "toward the level of the effort (load and endurance weigh on it); recovers in minutes real"

[[law]]
id = "sleep_debt"
variables = ["sleepiness"]
form = "rate"
basis = "design"
unit = "millièmes d'unité par heure de jeu ; rapports en millièmes"
params = { awake_rate = 4500, night_permille = 1300, per_exhaustion_permille = 2, during_sleep_rate = -12000, lying_awake_rate = -1500 }
reads = ["exhaustion"]
doc_ref = "docs/14 ; ETAT.md T21"
label_fr = "la dette de sommeil monte éveillé, seul le sommeil la rembourse"
note = "rises awake (more at night, with exhaustion); only sleep repays it"

# ---- le corps : chaleur, douleur, sang, souffle ------------------------------------------------------------------------
[[law]]
id = "body_temperature_follow"
variables = ["body_temperature"]
form = "relax"
basis = "physics"
unit = "milli-degrés Celsius ; effet de l'effort en milli-degrés selon l'effort ; constante de temps en heures de jeu"
by_exertion = [-200, 0, 100, 300, 1000, 700]
params = { body_milli_c = 37000, comfort_air_milli_c = 20000, gain_permille = 120, tau_game_h = 2, min_milli_c = 20000, max_milli_c = 45000, cold_danger_milli_c = 33000, heat_danger_milli_c = 41000 }
depends_on = ["air_temperature"]
doc_ref = "docs/14 ; ETAT.md T21"
label_fr = "la température du corps suit l'air à travers les vêtements et l'effort"
note = "follows air, clothing insulation and effort; fever needs the illness list (no law yet); danger flags below cold_danger and above heat_danger"

[[law]]
id = "thermal_comfort_derived"
variables = ["thermal_comfort"]
form = "derived"
basis = "design"
unit = "milli-degrés par dixième d'échelle (3 degrés = toute l'échelle) ; référence = body_temperature_follow.body_milli_c"
params = { milli_c_per_tenth = 30 }
depends_on = ["body_temperature"]
doc_ref = "docs/14 ; ETAT.md T21"
label_fr = "le confort thermique se déduit de la température du corps"
note = "derived from the body temperature"

[[law]]
id = "pain_fade"
variables = ["pain"]
form = "relax"
basis = "design"
unit = "constante de temps en secondes réelles"
params = { tau_real_s = 120 }
doc_ref = "docs/14 ; ETAT.md T21"
label_fr = "la douleur retombe vers ce que les plaies entretiennent"
note = "fades toward the ache kept by the open wounds"

[[law]]
id = "bleeding_clot"
variables = ["bleeding"]
form = "relax"
basis = "physics"
unit = "constante de temps en secondes réelles"
params = { tau_real_s = 60 }
doc_ref = "docs/14 ; ETAT.md T21"
label_fr = "le saignement se caille vers celui des plaies ouvertes"
note = "clots toward the bleeding of the open wounds"

[[law]]
id = "blood_balance"
variables = ["blood_volume"]
form = "rate"
basis = "physics"
unit = "milli-pourcents (de 100 000 = plein) ; taux en millièmes de milli-pourcent par heure de jeu"
params = { loss_per_bleed_tenth = 300000, regen = 1000000, full_milli_pct = 100000, weak_milli_pct = 60000 }
reads = ["bleeding", "reserves"]
doc_ref = "docs/14 ; ETAT.md T21"
label_fr = "le sang se perd avec le saignement, se refait lentement"
note = "falls with the bleeding, regained slowly when nothing bleeds and the reserves allow; below weak_milli_pct the blood-low flag; death in death_thresholds"

[[law]]
id = "breath_balance"
variables = ["breath"]
form = "rate"
basis = "physics"
unit = "millièmes d'unité par heure de jeu ; constante de temps en secondes réelles ; seuil en unités stockées"
params = { loss_rate = 562500, tau_real_s = 4, low_below = 30 }
doc_ref = "docs/14 ; ETAT.md T21"
label_fr = "le souffle baisse en asphyxie, revient sinon"
note = "falls when asphyxiating (the whole scale in 40 s real), returns otherwise; below low_below the no-breath flag"

[[law]]
id = "death_thresholds"
variables = ["alive"]
form = "threshold"
basis = "physics"
unit = "milli-pourcents de sang ; secondes de jeu de souffle à zéro"
params = { blood_milli_pct = 40000, breath_zero_game_s = 180 }
depends_on = ["blood_volume", "breath"]
doc_ref = "docs/14 ; ETAT.md T21 (body.toml)"
label_fr = "la mort : le sang sous 40 %, le souffle à zéro trop longtemps"
note = "alive is written false by step() when the blood falls below blood_milli_pct or the breath stays at zero for breath_zero_game_s; no other death yet (backlog T34)"

[[law]]
id = "consciousness_follow"
variables = ["consciousness"]
form = "relax"
basis = "design"
unit = "constantes de temps en secondes de jeu ; niveau de sommeil en unités stockées ; sang en milli-pourcents"
params = { down_tau_game_s = 120, up_tau_game_s = 600, sleep_level = 20, intoxication_divisor = 2, pain_onset = 80, pain_weight = 3, blood_divisor = 500, breath_factor = 2 }
depends_on = ["blood_volume", "breath", "intoxication"]
reads = ["pain"]
doc_ref = "docs/14 ; ETAT.md T21"
label_fr = "la conscience suit ce que le corps permet"
note = "follows sleep, blood, pain, drug, breath"

[[law]]
id = "intoxication_wear_off"
variables = ["intoxication"]
form = "rate"
basis = "physics"
unit = "millièmes d'unité par heure de jeu"
params = { fall_rate = 15000 }
doc_ref = "docs/14 ; ETAT.md T21"
label_fr = "l'ivresse se dissipe en heures"
note = "wears off in hours (1.5 points per game hour)"

[[law]]
id = "famine_collapse"
variables = ["strength", "robustness"]
form = "rate"
basis = "design"
unit = "millièmes d'unité par heure de jeu"
params = { rate = 208 }
depends_on = ["reserves"]
doc_ref = "docs/14 ; ETAT.md T21"
label_fr = "force et robustesse s'effondrent quand les réserves sont vides"
note = "collapses in famine while the reserves are empty (5 tenths per game day)"

# ---- la vie : âge, vieillissement --------------------------------------------------------------------------------------
[[law]]
id = "ageing_decline"
variables = ["strength", "endurance", "agility", "vision"]
form = "rate"
basis = "design"
unit = "millièmes d'unité perdus par dixième d'année d'âge gagné, à pleine sénescence"
params = { decline_per_age_tenth_milli = 25 }
depends_on = ["senescence"]
doc_ref = "docs/14 ; ETAT.md T21"
label_fr = "les capacités déclinent avec la sénescence"
note = "declines with senescence (the eye wound is in the wound list)"

[[law]]
id = "senescence_derived"
variables = ["senescence"]
form = "derived"
basis = "design"
unit = "âge en dixièmes d'année"
params = { from_age_tenths = 400, full_age_tenths = 750 }
depends_on = ["age_years"]
doc_ref = "docs/14 ; ETAT.md T21"
label_fr = "la sénescence se déduit de l'âge (40 à 75 ans)"
note = "derived from the age (40 to 75 years)"

[[law]]
id = "life_clock_advance"
variables = ["life_clock"]
form = "derived"
basis = "physics"
unit = "secondes de jeu vécues"
params = {}
depends_on = ["game_time"]
doc_ref = "docs/14 ; ETAT.md T21 (LifeClock)"
label_fr = "l'horloge de vie avance avec le temps de jeu"
note = "advances with the game time"

[[law]]
id = "life_clock_age"
variables = ["age_years"]
form = "derived"
basis = "physics"
unit = "milli-années"
params = {}
depends_on = ["life_clock"]
doc_ref = "docs/14 ; ETAT.md T21 (LifeClock)"
label_fr = "l'âge se déduit de l'horloge de vie"
note = "derived from the life clock (LifeClock)"

[[law]]
id = "life_stage_threshold"
variables = ["life_stage"]
form = "threshold"
basis = "physics"
unit = "âge en dixièmes d'année (la fin de l'enfance ; les autres bornes viennent de LifeClock et de la règle D10)"
params = { infant_end_tenths = 30 }
depends_on = ["age_years"]
doc_ref = "docs/14 ; ETAT.md T21 (LifeClock)"
label_fr = "les âges de la vie : nourrisson jusqu'à 3 ans"
note = "derived from the age: infant < infant_end, child < 14, teen < 18 (D10), adult < 60 (LifeClock)"

# ---- le corps : capacités dérivées ------------------------------------------------------------------------------------
[[law]]
id = "mobility_derived"
variables = ["mobility"]
form = "derived"
basis = "design"
unit = "millièmes (1000 = pleine mobilité) ; charge en millièmes de la capacité"
params = { base = 1000, exhaustion_weight = 4, load_over_permille = 1000, load_divisor = 2, pain_onset = 50, pain_weight = 4, intoxication_weight = 2 }
depends_on = ["exhaustion", "intoxication"]
reads = ["pain"]
doc_ref = "docs/14 ; ETAT.md T21"
