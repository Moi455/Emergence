# percept_words.toml - étape 19a : les MOTS de ce qui se perçoit (carrure, marques, signes, santé, tenue, état, temps,
# signes étranges, couleur, blessure). Chaque variable de liste de perception déclare la catégorie qu'elle peut porter
# (`words_from`) : un ensemble FERMÉ, au lieu d'une liste de mots libres. Ce qu'on voit et ce qu'on peut dire sont les
# mêmes mots : (appears @E1 bald), (described bald), un goût pour le bleu (TASTE.concept). La calvitie ne se perçoit pas
# d'un côté et ne se dit pas de l'autre (étape 19a).
# Table des sortes (≤ 1 024 avec les types d'objets, matières, espèces, formes et sortes de lieux), pas des mots de grammaire.


