# sites.toml - étape 19a : les SORTES de lieux et de constructions (la table `sortes` de la langue, comme les types d'objets).
#
# Un lieu ou une construction a une SORTE apparente : « une maison », « le pont », « une cité au-delà du désert ». C'est ce
# que lc_kind (le lieu tel qu'on le croit) et pc_kind_seen (la chose vue) portent, et ce que la langue peut nommer : dans
# exists, recipe, is_a, described, et (channel … (into house)) pour bâtir. Une sorte n'est ni une histoire ni une règle ;
# `built = true` : faite de mains, on peut y façonner la matière (forme) ; un lieu naturel ne se bâtit pas.
# Budget : ces mots sont dans la table des sortes (≤ 1 024 avec les types, matières, espèces, formes et mots perçus),
# pas dans les 768 mots de grammaire.


