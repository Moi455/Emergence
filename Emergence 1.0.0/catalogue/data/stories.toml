interpretations = ["assault", "drunkenness"]
utterances = ["(assert (owns me @T1))", "(request (not (did you strike @E2)))"]
note = "take(target=chope, from=hand_of, hold=in_hand) ; strike(head, fist, swing, firm, c_done) ; aubergiste : grab(hold_zone=collar, firm, until=c_target_yields) + push(direction=away, firm)"
charter = ["§8", "§27"]
text_fr = "Deux ivrognes se disputent une chope ; l'un donne un coup de poing, l'autre tombe, la bagarre s'arrête quand l'aubergiste les sépare."

[[story]]
id = "beating_near_death"
