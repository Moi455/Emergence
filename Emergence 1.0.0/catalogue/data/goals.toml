  { id = "a_obligations", label_fr = "qui doit rendre vrai quoi, avant quand, à quelle condition, une fois ou à chaque période (chaque jour, chaque saison, chaque année), et la part déjà remplie", holder = "agreement_terms", scale = "list", writer = ["engine"], visibility = "engine", dynamics = "repris tel quel de la proposition acceptée (expression de la langue)", clock = "day", no_law_reason = "execution facts written by the executor (T15/T22), no time law" },
