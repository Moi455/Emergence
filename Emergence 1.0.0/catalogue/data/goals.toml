  { id = "a_kind_label", label_fr = "étiquette pour la chronique (prêt, vente, mariage, emploi, apprentissage, serment, alliance, garde…)", holder = "agreement_terms", scale = "enum", values = ["promise", "loan", "sale", "barter", "employment", "apprenticeship", "marriage", "betrothal", "oath", "alliance", "custody", "other"], writer = ["derived"], visibility = "engine", dynamics = "tirée du contenu ; sert à l'affichage, jamais à décider", clock = "day" },
