  { id = "a_form", label_fr = "forme (dit, devant témoins, écrit, scellé, rituel)", holder = "agreement_terms", scale = "enum", values = ["spoken", "witnessed", "written", "sealed", "ritual"], writer = ["engine"], visibility = "engine", dynamics = "écrit quand une inscription le porte ; scellé si un sceau y est apposé ; rituel si fait selon une coutume crue (noces au temple)", clock = "day", no_law_reason = "execution facts written by the executor (T15/T22), no time law" },
