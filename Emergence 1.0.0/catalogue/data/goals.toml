# goals.toml - étape 9 : objectifs, intention en cours, demandes reçues, accords.
#
# Un OBJECTIF = une proposition qu'on veut rendre vraie, garder vraie ou empêcher (charte § 9).
# Les objectifs de la charte ne sont que des propositions, pas une liste fermée :
#   économiser pour une maison = owns(moi, maison) ; séduire = attitude(X, attraction, moi, haut) ;
#   se venger = feels(X, pain…) ou dead(X) ou has_trait(X, coupable) cru de tous ; quitter le village =
#   lives_at(moi, ailleurs) ; apprendre un métier = knows_how(moi, forge) ; s'enrichir = amount(mes
#   biens, beaucoup) ; une fonction = holds(moi, chef) ; retrouver quelqu'un = at(frère, lieu connu).
# L'INTENTION = la suite de gestes choisie pour avancer (charte § 8 : une action ou une séquence) ;
# interrompue quand la perception change, elle repasse au Transformer.
# Un ACCORD naît de deux paroles (proposer, accepter) : le moteur l'enregistre comme un fait (qui,
# quoi, quand, devant qui) et ne constate que des faits (en cours, échéance passée, délié par le bénéficiaire,
# partie morte). Tenu ou rompu, trahison ou excuse valable : cela appartient aux personnes (P50).
# Le moteur ne conclut jamais à la place d'une personne (P35) : il ne dit pas qu'un objectif est atteint ou
# perdu, il RÉVEILLE (WAKE.cause = goal_check, ou à l'échéance) et le modèle écrit g_status. Mariage, prêt, emploi, apprentissage, serment, garde
# d'une maison : tous des accords, aucun n'est une action dédiée.
# Règle dure (D10) : le gouverneur refuse tout objectif romantique ou intime envers un mineur, et
# tout accord de mariage impliquant un mineur.
# Budget de l'IA : ≤ 4 jetons GOAL, 2 jetons PLAN (le plan en cours et le plan suspendu remontré), ≤ 2 jetons REQUEST,
# ≤ 3 jetons COMMIT par décision. Réserve de 4 intentions (un plan par objectif actif, T08b).

variable = [
  # ─── Objectif ───
  { id = "g_desired", label_fr = "ce qu'on veut (proposition)", holder = "goal", scale = "proposition", writer = ["T_jump"], dynamics = "créé, réorienté (autre cible) ou abandonné par le Transformer ; au plus 8 gardés", token = "GOAL.prop", clock = "day" },
  { id = "g_mode", label_fr = "rendre vrai, garder vrai, empêcher", holder = "goal", scale = "enum", values_from = "goal_mode", writer = ["T_jump"], token = "GOAL.mode" },
  { id = "g_priority", label_fr = "priorité", holder = "goal", scale = "unipolar10", writer = ["T_step"], step = 1.0, rate = 3.0, token = "GOAL.priority" },
  { id = "g_deadline", label_fr = "échéance (avant la fête, avant l'hiver…)", holder = "goal", scale = "time", writer = ["T_jump", "engine"], dynamics = "quand l'objectif vient d'un accord, le moteur reprend l'échéance CRUE (commitments_seen), jamais la vraie ; à l'échéance il réveille (timer), il ne juge pas", token = "GOAL.deadline", clock = "day", no_law_reason = "execution facts written by the executor (T15/T22), no time law" },
  { id = "g_when", label_fr = "rendez-vous : le moment où il faut y être ou le faire (« à l'aube », « dans 3 jours »), distinct de l'échéance g_deadline (« avant »)", holder = "goal", scale = "time", writer = ["T_jump", "engine"], dynamics = "tiré de la proposition de l'objectif quand elle porte (at_time TE …) ; le moteur ne le lit que pour réveiller le PNJ à l'heure, jamais pour décider à sa place", token = "GOAL.when", clock = "day", no_law_reason = "execution facts written by the executor (T15/T22), no time law" },
  { id = "g_origin", label_fr = "d'où vient l'objectif (de soi, d'une demande, d'un rôle, d'un accord, d'une norme)", holder = "goal", scale = "enum", values = ["self", "asked", "role", "agreement", "norm"], writer = ["T_jump", "engine"], token = "GOAL.origin", no_law_reason = "execution facts written by the executor (T15/T22), no time law" },
  { id = "g_origin_ref", label_fr = "qui l'a demandé, quel accord, quel rôle", holder = "goal", scale = "mref", writer = ["engine", "T_jump"], token = "GOAL.origin_ref (pointeur)", no_law_reason = "execution facts written by the executor (T15/T22), no time law" },
  { id = "g_parent", label_fr = "l'objectif dont celui-ci est une étape (sous-objectif : « trouver de l'or » sert « enrichir le village »)", holder = "goal", scale = "mref", writer = ["T_jump"], dynamics = "écrit par le modèle en créant le sous-objectif ; pointe un autre GOAL du même PNJ ; le moteur n'en tire aucune conséquence", token = "GOAL.parent (pointeur)", clock = "day" },
  { id = "g_has_plan", label_fr = "cet objectif a-t-il déjà un plan (au moins une intention non abandonnée) ?", holder = "goal", scale = "bool", writer = ["derived"], dynamics = "calculé des intentions que le PNJ a écrites (i_serves) ; montre les objectifs encore sans plan, pour que le modèle en écrive un", token = "GOAL.has_plan", reads = ["i_serves"], clock = "day" },
  { id = "g_status", label_fr = "état (actif, en pause, atteint, échoué, abandonné)", holder = "goal", scale = "enum", values = ["active", "paused", "achieved", "failed", "abandoned"], writer = ["T_jump"], dynamics = "ÉCRIT PAR LE MODÈLE SEUL (P35) : il met en pause, reprend, déclare atteint ou échoué, abandonne. Le moteur ne constate rien : quand une valeur dérivée des croyances change (g_progress atteint 1, une croyance contredit l'objectif) il réveille avec goal_check, et la personne relit puis écrit. Un mort qu'elle n'a pas appris reste à venger", token = "GOAL.status", clock = "day" },
  { id = "g_progress", label_fr = "avancement (quand il se mesure : pièces économisées / prix cru de la maison)", holder = "goal", scale = "ratio", writer = ["derived"], token = "GOAL.progress", reads = ["b_proposition", "inv_seen"] },
  { id = "g_since", label_fr = "depuis quand", holder = "goal", scale = "time", writer = ["engine"], clock = "none", dynamics = "horodatage : un instant de jeu en secondes (jamais une durée) ; l'oubli en tire la récence par maintenant − cette valeur, une valeur plus petite = plus ancien", token = "GOAL.age", no_law_reason = "execution facts written by the executor (T15/T22), no time law" },
  # ─── Intention en cours ───
  { id = "i_steps", label_fr = "la suite de gestes choisie (1 à 6), chacun avec ses conditions d'arrêt et d'interruption", holder = "intention", scale = "list", writer = ["T_jump"], dynamics = "gestes et conditions de l'étape 12 ; le moteur l'exécute seul jusqu'à la fin, l'échec ou l'interruption ; le PNJ relit son plan : jusqu'à 6 gestes (mots), chacun avec sa cible dans i_step_targets", token = "PLAN.steps", clock = "day", list_of = "word" },
  { id = "i_step_targets", label_fr = "la cible de chacune des premières étapes (jusqu'à 4 pointeurs, dans l'ordre de i_steps ; vide = pas de cible)", holder = "intention", scale = "list", list_of = "mref", writer = ["T_jump"], dynamics = "écrit avec i_steps ; un PNJ peut ainsi relire « aller à @L3, saisir @T2, frapper @E4 » et réviser un plan long", token = "PLAN.step_targets (pointeurs)", clock = "day" },
  { id = "i_speech", label_fr = "la parole prévue : l'énoncé complet que le PNJ compte dire à l'étape `speak` (une offre préparée, un recrutement)", holder = "intention", scale = "proposition", writer = ["T_jump"], dynamics = "préparée à l'avance, pas dite : relue et révisée comme le reste du plan ; au moment de parler elle est validée, puis figée comme toute parole (language_grammar.toml). Elle libère le but (g:) du bord des 20 symboles", token = "PLAN.says", clock = "day" },
  { id = "i_serves", label_fr = "l'objectif qu'elle sert", holder = "intention", scale = "mref", writer = ["T_jump"], token = "PLAN.goal (pointeur)" },
  { id = "i_step_index", label_fr = "étape en cours (numéro dans i_steps)", holder = "intention", scale = "qty", writer = ["engine"], dynamics = "avance quand le moteur constate que l'étape a fini (fait d'exécution) ; le modèle la relit par PLAN.step et PLAN.next", clock = "day", no_law_reason = "execution facts written by the executor (T15/T22), no time law" },
  { id = "i_step_progress", label_fr = "où en est l'étape en cours (0 à 1)", holder = "intention", scale = "ratio", writer = ["engine"], dynamics = "fait d'exécution : avance avec le geste, remis à 0 à chaque étape ; sauvegardé", token = "PLAN.progress", clock = "day", no_law_reason = "execution facts written by the executor (T15/T22), no time law" },
  { id = "i_step_started", label_fr = "quand l'étape en cours a commencé (temps de jeu)", holder = "intention", scale = "time", writer = ["engine"], visibility = "engine", dynamics = "sauvegardé : une étape en cours survit au rechargement ; sert au calcul de i_step_progress, jamais à un jugement", clock = "day", no_law_reason = "execution facts written by the executor (T15/T22), no time law" },
  { id = "i_status", label_fr = "où en est le plan (en cours, suspendu, bloqué = geste sans effet perçu, fini, abandonné)", holder = "intention", scale = "enum", values = ["running", "suspended", "blocked", "done", "abandoned"], writer = ["engine", "T_jump"], dynamics = "le moteur n'écrit que des FAITS : running (le geste choisi est PLAN.next), suspended (le modèle a choisi un autre geste), blocked (un fait d'exécution perçu sur place : le geste n'a produit aucun effet, c_blocked ; ce n'est PAS une comparaison avec le but), done (les étapes sont épuisées). Seul le modèle écrit abandoned, jamais le moteur (P35)", token = "PLAN.status", clock = "day", no_law_reason = "execution facts written by the executor (T15/T22), no time law" },
  { id = "i_repeat", label_fr = "le plan se refait-il (une fois, chaque jour, chaque saison, chaque année, ou toutes les N heures) ?", holder = "intention", scale = "enum", values = ["once", "each_day", "each_season", "each_year", "every"], writer = ["T_jump"], dynamics = "écrit par le modèle ; le moteur ne fait que réveiller à la période (timer, P2b) : le plan terminé ou suspendu est remontré, la personne décide de le refaire", token = "PLAN.repeat", clock = "day" },
  { id = "i_repeat_period", label_fr = "la période de i_repeat = every, en heures de jeu (1 à 2 000) : un tour de garde toutes les 8 h, une réunion tous les 2 jours", holder = "intention", scale = "qty", writer = ["T_jump"], dynamics = "en heures et en jours de jeu, jamais en semaines : avec D30 une année dure environ 4,7 jours de jeu, une semaine de 7 jours la dépasserait", token = "PLAN.repeat_period", clock = "day" },
  { id = "i_attempts", label_fr = "combien de fois l'étape en cours a échoué", holder = "intention", scale = "qty", writer = ["engine"], dynamics = "compte les échecs PERÇUS sur place (P51), remis à 0 quand l'étape change ; un fait, pas un verdict", token = "PLAN.attempts", clock = "day", no_law_reason = "execution facts written by the executor (T15/T22), no time law" },
  { id = "i_commitment", label_fr = "fermeté (résister aux interruptions mineures)", holder = "intention", scale = "unipolar10", writer = ["T_jump"], dynamics = "haute : seul un vrai danger interrompt ; basse : la moindre chose détourne", token = "PLAN.commitment", clock = "day" },
