# language_core.toml - le cœur de la langue intérieure : ce qu'on peut croire, désirer, promettre, dire.
#
# Une PROPOSITION = un prédicat + ses arguments (pointeurs vers des entités, concepts, quantités,
# ou une proposition imbriquée), avec polarité (vrai / faux) et temps (passé, maintenant, futur,
# habituel). Les arguments ne pointent JAMAIS vers la vérité (revue du 9 oct.) : une personne est un
# DOSSIER MENTAL du PNJ (« celui que je crois être Aldric », identifié avec une certitude, ou « un
# certain Aldric du moulin » dont il n'a qu'entendu parler) ; un événement est un événement qu'il se
# rappelle ou qu'on lui décrit ; un lieu est un lieu tel qu'il le connaît. D'où : se tromper de
# personne dans le noir, accuser d'un fait inventé, ignorer qui est Aldric, se perdre.
# Un ÉVÉNEMENT se décrit par un cadre : did(agent, geste, cible) puis des rôles qui s'y attachent
# (with, to, into, how, says) : ≤ 2 rôles en ligne dans le même jeton, says ou une proposition imbriquée
# coûte un jeton de plus (règle unique : catalogue/README.md).
# La même forme sert partout :
#   croyance = proposition tenue pour vraie (étape 6) ; objectif = proposition désirée (étape 9) ;
#   norme = proposition déontique (« il est interdit que… ») ; accord = proposition qu'on s'engage
#   à rendre vraie ; parole = proposition dite avec un mode (affirmer, demander…) (étape 13).
# Le mensonge n'a pas de prédicat : c'est affirmer une proposition qu'on croit fausse.
# Le chantage n'a pas de prédicat : « si tu ne me donnes pas 3 pièces, je dirai à ton mari que tu as
# embrassé X » = une condition + une parole future + un fait passé.
# Budget de l'IA : un jeton par proposition (prédicat + ≤ 3 pointeurs + polarité + temps) ;
# l'imbrication est limitée à 2 niveaux (« je crois qu'elle croit que… », pas plus).
# L'étape 13 complète : modes, logique, quantités, temps, et le vocabulaire tiré du catalogue.

