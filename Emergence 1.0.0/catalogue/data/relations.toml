# relations.toml - étape 7 : les attitudes envers chaque personne (ou groupe, rôle, animal) connue.
#
# Asymétriques : ce que A ressent pour B n'est pas ce que B ressent pour A. Chacun ne connaît de
# l'autre que ce qu'il CROIT qu'il pense de lui (perceived_regard) : théorie de l'esprit.
# La cible peut être un groupe (le village, la guilde) ou un rôle (le chef) : on peut aimer son
# village et détester son chef, respecter son maître et mépriser sa façon de faire (charte § 11).
# Les étiquettes « ami », « ennemi », « rival » ne sont pas stockées : elles se lisent dans les
# attitudes, ou sont des liens crus (link, croyances), ou des accords (mariage, emploi).
# Écriture : le Transformer, par petits pas (0,5 ; D18) ; la crainte peut sauter. Le moteur ne fait
# que la familiarité (le temps passé ensemble) et l'effacement lent loin des yeux. Pas de règle
# « il m'a aidé donc affection + 1 » : c'est au modèle de juger.
# Règle dure (D10) : aucune attirance ne peut monter envers un enfant ou un adolescent, ni d'un
# enfant ou d'un adolescent ; le gouverneur refuse, quoi que dise le modèle.
# Budget de l'IA : ≤ 10 jetons ENTITY (personnes saillantes) avec ces attitudes + l'apparence
# (body.toml) + la réputation crue ; ≤ 2 jetons GROUP (attitudes envers un groupe ou un rôle).

variable = [
  { id = "r_true_entity", label_fr = "la vraie entité derrière ce dossier mental (le moteur seul la connaît)", holder = "relation", scale = "id", writer = ["engine"], visibility = "engine", note = "Une relation est un DOSSIER MENTAL : « celui que je crois être Aldric », ou « un certain Aldric du moulin » dont on n'a qu'entendu parler. Les jetons pointent vers le dossier, jamais vers la vraie entité.", intimate = false },
  { id = "r_known_by", label_fr = "comment on le connaît (vu et reconnu, seulement de nom, seulement décrit)", holder = "relation", scale = "enum", values = ["seen", "name_only", "described"], writer = ["engine"], dynamics = "un dossier « de nom » se lie à une personne vue quand on apprend que c'est elle (une croyance, qui peut être fausse)", token = "ENTITY.known_by ; GROUP.known_by", clock = "day", intimate = false },
  { id = "r_present", label_fr = "là maintenant pour CE PNJ (perçu), ou absent de sa perception", holder = "relation", scale = "bool", writer = ["derived"], dynamics = "présent = une perception de la personne en ce moment (entity_percept) ; un absent saillant (un proche, quelqu'un attendu) reste montré : on remarque l'absence (charte § 20) ; quelqu'un de caché est absent pour lui", token = "ENTITY.present", clock = "day", intimate = false, reads = ["ep_dist"] },
  { id = "r_affection", label_fr = "affection (−10 haine, +10 amour profond)", holder = "relation", writer = ["T_step", "engine"], step = 0.5, rate = 2.0, dynamics = "le moteur ne fait que l'effacement lent vers 0 après des années sans contact", token = "ENTITY.rel.affection ; GROUP.rel.affection", clock = "day", intimate = false },
  { id = "r_trust", label_fr = "confiance (−10 s'attend à être trompé, +10 confie sa vie)", holder = "relation", writer = ["T_step", "engine"], step = 0.5, rate = 2.0, dynamics = "idem", token = "ENTITY.rel.trust ; GROUP.rel.trust", clock = "day", intimate = false },
  { id = "r_respect", label_fr = "respect, admiration (−10 mépris, +10 admiration)", holder = "relation", writer = ["T_step", "engine"], step = 0.5, rate = 2.0, dynamics = "idem", token = "ENTITY.rel.respect ; GROUP.rel.respect", clock = "day", intimate = false },
  { id = "r_attraction", label_fr = "attirance amoureuse (adultes seulement)", holder = "relation", scale = "unipolar10", writer = ["T_step", "engine"], step = 0.5, rate = 2.0, dynamics = "règle dure D10 appliquée par le gouverneur ; le moteur ne fait que l'effacement", token = "ENTITY.rel.attraction", clock = "day", intimate = true },
  { id = "r_fear", label_fr = "crainte de cette personne", holder = "relation", scale = "unipolar10", writer = ["T_jump", "engine"], dynamics = "peut sauter (il a sorti un couteau) ; retombe lentement", token = "ENTITY.rel.fear ; GROUP.rel.fear", clock = "day", intimate = false },
  { id = "r_resentment", label_fr = "rancune", holder = "relation", scale = "unipolar10", writer = ["T_step", "engine"], step = 0.5, rate = 2.0, dynamics = "le moteur l'efface très lentement, d'autant plus lentement que la personne est peu portée au pardon", token = "ENTITY.rel.resentment ; GROUP.rel.resentment", clock = "day", intimate = false },
  { id = "r_obligation", label_fr = "dette morale ressentie (on lui doit quelque chose, sans contrat)", holder = "relation", writer = ["T_step", "engine"], step = 0.5, rate = 2.0, dynamics = "+ : je lui dois ; − : il me doit", token = "ENTITY.rel.obligation", clock = "day", intimate = false },
  { id = "r_rivalry", label_fr = "rivalité (en concurrence pour une même chose : une place, une personne, un marché)", holder = "relation", scale = "unipolar10", writer = ["T_step", "engine"], step = 0.5, rate = 2.0, token = "ENTITY.rel.rivalry", intimate = false },
  { id = "r_familiarity", label_fr = "familiarité (combien on le connaît)", holder = "relation", scale = "unipolar10", writer = ["engine"], dynamics = "monte avec le temps passé ensemble et les échanges, baisse lentement sans contact", token = "ENTITY.rel.familiarity", clock = "day", intimate = false },
  { id = "r_perceived_regard", label_fr = "ce qu'on croit qu'il pense de soi (−10 il me hait, +10 il m'adore)", holder = "relation", writer = ["derived"], dynamics = "résumé des croyances attitude(lui, …, moi) : ce qu'on croit qu'il pense de soi ; peut être faux", token = "ENTITY.rel.perceived_regard", clock = "day", intimate = false, reads = ["b_proposition"] },
  { id = "r_last_contact", label_fr = "dernière fois qu'on s'est vus ou parlé", holder = "relation", scale = "time", writer = ["engine"], intimate = false },
  { id = "r_shared_history", label_fr = "nombre de souvenirs partagés", holder = "relation", scale = "qty", writer = ["derived"], visibility = "private", intimate = false },
  { id = "r_link_believed", label_fr = "le lien qu'on croit avoir (parent, conjoint, maître, employeur…)", holder = "relation", scale = "enum", values_from = "link", writer = ["derived"], dynamics = "tiré des croyances link et des accords tels que crus (commitments_seen) ; le plus fort est montré", token = "ENTITY.link", clock = "day", intimate = false, reads = ["b_proposition", "commitments_seen"] },
  { id = "r_reputation_seen", label_fr = "ce qu'on croit de lui : honnête, dangereux, compétent, riche, pieux (réputation crue)", holder = "relation", scale = "list", writer = ["derived"], dynamics = "tiré des croyances has_trait ; on peut se tromper", token = "ENTITY.rep (honnêteté, danger, compétence, richesse, piété)", clock = "day", intimate = false, list_of = "qty", reads = ["b_proposition"], components = ["honesty", "danger", "competence", "wealth", "piety"] },
  # ─── Le dossier d'un GROUPE (étape 19a) : ce qu'on croit de la bande, de l'équipe, de « nous trois » ───
  # Tout est tiré des croyances (member, leads, holds, intends, is_a) : le moteur ne décide ni qui est membre ni qui mène.
  # Un groupe de circonstance naît en parlant : « nous » se fige en un groupe dont les membres sont le parleur, ceux à
  # qui il parle et ceux qu'il nomme dans la même parole (voir data/language_grammar.toml).
  { id = "r_group_members", label_fr = "les membres que je crois qu'il a (au plus 4 gardés, moi compris si j'en suis)", holder = "relation", scale = "list", list_of = "mref", writer = ["derived"], visibility = "private", dynamics = "tiré des croyances member ; un absent saillant garde son dossier", token = "GROUP.members (pointeurs)", clock = "day", intimate = false, reads = ["b_proposition"] },
  { id = "r_group_leader", label_fr = "celui que je crois être son chef (ou personne)", holder = "relation", scale = "mref", writer = ["derived"], visibility = "private", dynamics = "tiré des croyances leads ; deux PNJ peuvent croire à deux chefs", token = "GROUP.leader (pointeur)", clock = "day", intimate = false, reads = ["b_proposition"] },
  { id = "r_group_goal", label_fr = "ce que je crois qu'il veut ou compte faire (une proposition : « tuer George », « trouver de l'or »)", holder = "relation", scale = "proposition", writer = ["derived"], visibility = "private", dynamics = "tiré des croyances wants / intends dont le sujet est le groupe", token = "GROUP.goal", clock = "day", intimate = false, reads = ["b_proposition"] },
  { id = "r_group_role", label_fr = "mon rôle cru dans ce groupe (chef, membre, invité, étranger…)", holder = "relation", scale = "word", writer = ["derived"], visibility = "private", dynamics = "tiré des croyances holds et member", token = "GROUP.role", clock = "day", intimate = false, reads = ["b_proposition"] },
  { id = "r_group_kind", label_fr = "ce que je crois qu'il est (foyer, bande, équipe, guilde, culte…)", holder = "relation", scale = "word", writer = ["derived"], visibility = "private", dynamics = "tiré des croyances is_a", token = "GROUP.kind", clock = "day", intimate = false, reads = ["b_proposition"] },
  { id = "r_group_size", label_fr = "combien je crois qu'ils sont", holder = "relation", scale = "qty", writer = ["derived"], visibility = "private", dynamics = "tiré des croyances count et member", token = "GROUP.size", clock = "day", intimate = false, reads = ["b_proposition"] },
  { id = "relation_capacity", label_fr = "nombre de relations gardées", holder = "relations", scale = "qty", writer = ["derived"], visibility = "engine", dynamics = "jusqu'à 96 ; au-delà, la moins familière et la moins forte s'efface", clock = "day" },
