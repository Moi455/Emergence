# language_grammar.toml - étape 13 : la grammaire de la langue intérieure.
#
# Une parole = un MODE + une PROPOSITION (ou une formule). Aucun mot ne nomme un acte social : il n'y a
# pas de « promettre », « menacer », « mentir », « faire chanter », « insulter », « flatter ». Ce sont des
# combinaisons :
#   promesse  = offer (did moi … future) ;  menace = assert (if (not …) (did moi strike …)) ;
#   mensonge  = assert P quand on croit non-P ;  rumeur = assert P (heard_said) ;
#   chantage  = offer (if (not (did you give …)) (did moi speak (to @mari) (says (that b:7)))).
# Écriture préfixe entre parenthèses ; les parenthèses ne comptent pas ; ≤ 20 symboles par parole
# (budget de l'IA). Imbrication des propositions dans un argument (believes, wants, says, that) ≤ 2.
#
# Pointeurs vers le contexte du parleur (ce que le modèle a sous les yeux, ses propres dossiers) :
#   @E3 = la personne du jeton ENTITY 3 ; @T5 = la chose du jeton THING 5 ; @G1 = le groupe 1 ;
#   @L2 = un lieu qu'il connaît (son dossier de lieu : « la forêt », « ma maison ») ; @V4 = un événement
#   qu'il vient de percevoir (jeton EVENT 4 : « ce que tu viens de faire ») ;
#   b:7 = sa croyance 7 ; m:2 = son souvenir 2 ; g:1 = son objectif 1 ; @PLACE = le lieu où l'on est.
# Au moment de DIRE ou d'ÉCRIRE, le moteur FIGE la parole (revue du 10 oct.), sans passer par la vérité :
#   - b:7, m:2, g:1 → une COPIE de la proposition, sur un seul niveau (pas de dépliage récursif), dont les
#     pointeurs sont figés à leur tour ; l'auditeur reçoit une seule nouvelle entrée HEARD ;
#   - me, you, @L : figés en nom ou description du parleur, comme les personnes ;
#   - une personne ou une chose pointée (@E2, @T5) est transmise sous la forme que le PARLEUR peut donner :
#     son nom s'il le croit (n:<nom>), un geste de désignation si elle est là (sign point), ou une description
#     tirée de ce que le parleur en perçoit (« described smith tall ») ; jamais l'identité vraie ;
#   - l'AUDITEUR apparie cette forme à ses propres dossiers avec ses croyances (named), sa perception (il voit
#     qui est désigné) ou ses descriptions, avec une certitude ; sinon il crée un dossier « un certain … ».
#   - `us` (étape 19a) : « nous » se fige en un GROUPE de circonstance dont les membres sont le parleur, ceux à qui il
#     parle et ceux qu'il nomme dans la même parole ; `(count us 3)` dit combien. L'auditeur crée (ou retrouve) un dossier
#     GROUP avec ces membres (≤ 4 gardés), un chef cru si la parole en désigne un (leads), un but cru si elle en annonce un
#     (intends, wants). Le moteur ne décide ni qui est membre ni qui mène : ce sont des croyances (member, leads).
#   - échange des personnes (l'étape « I ↔ YOU » d'ELIZA, docs/11) : pour l'auditeur, `me` devient le dossier du parleur
#     dans son esprit et `you` devient son propre `me` ; `us` reste `us`.
#   - h:3 / q:1 / c:2 (étape 19a) : ce que le parleur a entendu, ce qu'on lui a demandé, ce qu'il a convenu ; figés comme b:/m:/g:.
# Ainsi l'IA écrit court, l'auditeur reçoit une proposition dans ses propres termes, et l'on peut parler
# d'Aldric à quelqu'un qui ne le connaît pas, se tromper de personne, ou désigner sans nommer.
# Vocabulaire (catalogue/tools/language.py le construit) : mots de grammaire = les concepts, les gestes,
# les variables et propriétés nommables ; sortes = types d'objets, matières, espèces, formes, classes de
# sosies (table séparée, ≤ 1 024) ; noms propres = n:<id> dans la table des noms.

grammar = [
  { id = "utterance", rule = "UTT := MOOD PROP | FORMULA | FORMULA UTT | (yes|no) PTR [UTT]  (PTR : h: q: c:)", label_fr = "une parole" },
  { id = "proposition", rule = "PROP := [not] [TIME] [EVID] PRED ARG* ROLE* | LOGIC PROP PROP | TIME_OP TE PROP | that PTR   ;  TE := DAYPART | SEASON | today | tomorrow | yesterday | sometime | (span N UNIT) | PTR", label_fr = "une proposition" },
  { id = "logic", rule = "LOGIC := and | or | if | because", label_fr = "relier deux propositions (si…, parce que…)" },
  { id = "argument", rule = "ARG := REF | KIND[:QTY] | QTY | DEGREE | WORD | PROP | WH (seulement sous ask et sous knows)", label_fr = "un argument" },
  { id = "reference", rule = "REF := me | you | us | this | here | @E<n> | @T<n> | @G<n> | @L<n> | @PLACE | n:<n° de nom> | someone | anyone | everyone | no_one | somewhere | something | (of QTY REF) | (described WORD+ [CLAUSE])  — WORD : descriptor, role_word, occupation, sorte (lieu, mot perçu) ; CLAUSE : un prédicat dont un argument est the_one", label_fr = "désigner : soi, l'autre, ce qu'on montre, un pointeur du contexte, un nom, une description" },
  { id = "role", rule = "ROLE := (NOM_DE_PARAMÈTRE REF) | (how WORD) | (says PROP) ; NOM_DE_PARAMÈTRE : un paramètre-pointeur du geste (to, at, with, into, from, where, toward, on, against) ; with REF = compagnon si REF est une personne ou un groupe", label_fr = "les rôles d'un événement (cadre did) : les paramètres du geste, typés" },
  { id = "question", rule = "WH := who | what | where | when | why | how_much | which", label_fr = "le trou d'une question (ask)" },
  { id = "keyword_ranks", rule = "RANK[category] : la priorité d'un mot pour dire de quoi parle une parole (ELIZA : le mot-clé de plus haut rang commande)", ranks = { interpretation = 9, deontic = 8, gesture = 7, time_op = 6, logic = 5, event_role = 4, predicate = 4, quantity = 3, fraction = 3, evidential = 3, link = 3, emotion = 3, mood = 2, time = 2, formula = 1 }, label_fr = "rang des mots-clés" },
  { id = "limits", rule = "≤ 20 symboles ; imbrication d'arguments-propositions ≤ 2 ; un seul mode par parole", label_fr = "budget de l'IA" },
]

