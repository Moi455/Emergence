# Limites GRATUITES, par modele. SOURCE : la console AI Studio de Monsieur (15 oct. 2026, "utilise / limite") ; les chiffres
# ci-dessous sont les limites OBSERVEES, plus les suppositions de l'ancien fichier (14 oct.) qui etaient fausses.
# L'ORDRE est la preference (a delai egal, le premier est choisi). Un champ ABSENT = limite inconnue : le generateur
# l'apprend des reponses 429 (quotaValue) et la garde dans le carnet global.
# rpm = requetes/minute, rpd = requetes/jour, tpm = jetons d'ENTREE/minute, tpd = jetons/jour.
# tpm : valeur de la console (250 000 pour Flash et Flash Lite, 16 000 pour Gemma, 100 000 pour Antigravity). tpd : PLAFONDS LOCAUX
# PRUDENTS, des ESTIMATIONS (la console n'en affiche pas) : Lite 20 000 000, Flash 2 000 000 ; un 429 qui donne un `quotaValue`
# plus bas les ABAISSE (min(fichier, appris)), jamais plus haut. Le jour de quota se remet a zero a minuit, heure du Pacifique.
#
# LE CARNET EST GLOBAL : un seul fichier, ~/.local/share/emergence/dataset/quota_global.json (verrou flock, jour du Pacifique),
# partage par toutes les series et tous les outils (generateur, probe, bench, pilote). Google compte par CLE et par MODELE, pas
# par serie ni par nom.
# pool = "<modele>" : ce nom PARTAGE le quota de ce modele (ses compteurs sont ceux du pool, ses limites aussi). Mesure le 15 oct. :
#   gemini-flash-lite-latest = gemini-3.5-flash-lite (le 500e appel du jour refuse aux deux a la meme seconde : 407 + 93) ;
#   gemini-3.1-flash-lite-preview = gemini-3.1-flash-lite (429 jour et 429 jetons simultanes sur les deux) ;
#   gemini-pro-latest et gemini-3.1-pro-preview = gemini-3.1-pro (le 429 le DIT : quotaDimensions.model).
# Un alias dont on ne connait pas la cible reste hors chaine ; le premier 429 la revele (quotaDimensions.model) et le carnet la retient.
# tpm_target : fraction de la limite de jetons/minute visee (0,80 : avec 100 %, la minute reelle a atteint 110 % le 15 oct.).
# tpm_counts : "all" (defaut) compte entree + sortie + reflexion ; "input" l'entree seule (la metrique de Google est
#   `...InputTokensPerModelPerMinute` : pour Gemma, dont la reflexion pese 2 a 4 000 jetons sur 16 000, on ne compte que l'entree).
# thinking_budget : 0 coupe la reflexion interne (modeles 2.5) ; absent = laisse le defaut du modele.
# system_instruction / json_schema : false = le modele refuse systemInstruction / le schema JSON structure (valeur OBSERVEE) ;
#   absent = ce que sa famille accepte. Un modele sans l'un des deux est interroge par PromptOnlyStrategy.
# max_k : le modele ne prend que de PETITS lots ; le generateur le traite alors comme une VOIE de secours (voir generator.py).
# compact : le modele recoit le texte fixe COMPACT (12 phrases d'exemple au lieu de 30, schema sans les listes deja ecrites dans les
#   consignes) : meme consigne, meme vocabulaire, memes regles.
# enabled = false : le modele reste LISTE (avec `note`, la raison) mais n'entre pas dans la chaine ; `--models` peut le nommer.
# Les mesures de ces notes sont dans README.md, section "Modeles" ; sonde : python3 -m teacher.probe ; qualite : python3 -m teacher.bench.

margin = 1.05          # l'intervalle entre deux requetes d'un pool est 60/rpm x margin (jamais de rafale)
tpm_target = 0.80

[[model]]
name = "gemini-3.5-flash-lite"
rpm = 15               # console : 15 / 250 000 / 500
rpd = 500
tpm = 250000
tpd = 20000000

