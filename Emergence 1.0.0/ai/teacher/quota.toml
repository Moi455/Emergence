# ======================================================================================================================
# AUTRES FOURNISSEURS (16 oct. 2026) : Groq et OpenRouter, quota GRATUIT, cles hors du depot (~/.config/emergence/Groq_Key,
# OpenRouter_Key, droits 600). Un modele s'appelle `<fournisseur>/<id de l'API>` et ce nom entier est le `teacher` des lignes
# du dataset. `provider` est obligatoire ; la CHAINE d'une execution est celle d'UN fournisseur (`--provider groq|openrouter`,
# defaut gemini) : leurs reponses sont lentes, elles tournent dans leur propre processus et leur propre serie, sur le meme carnet
# global. Champs propres : max_output (jetons demandes pour la reponse ; Groq les compte dans le TPM), reasoning_effort,
# minimal (texte de consignes MAIGRE : ni WRITES ni WORDS, 8 phrases), json_object (response_format json_object).
# TOUS sont enabled = false jusqu'a preuve (essai du 16 oct. : README.md, section "Autres professeurs") ; la raison est dans `note`.
#
# GROQ (console de Monsieur) : 30 req/min, 1 000 req/jour, 8 000 jetons/min, 200 000 jetons/jour par modele ; safeguard : 3 / 1 000 /
# 2 000 / 200 000. Le TPM de 8 000 interdit les consignes pleines (~8 000 jetons) : texte `minimal`, 1 situation par requete.
# ======================================================================================================================

[[model]]
name = "groq/openai/gpt-oss-120b"
provider = "groq"
enabled = false
note = "essai 16 oct. (6 situations, K=1, texte maigre) : 3 valides sur 6, 2 situations trop grosses pour 8 000 jetons/min (413), pensees vides 0/3 ; NON viable"
rpm = 30
rpd = 1000
tpm = 8000
tpd = 200000
max_k = 1
minimal = true
json_object = true
json_schema = false                    # le schema complet (4 300 caracteres) ne tient pas dans 8 000 jetons/min : texte compact dans le prompt
compact = true
max_output = 2000
reasoning_effort = "low"

[[model]]
name = "groq/openai/gpt-oss-20b"
provider = "groq"
enabled = false
note = "essai 16 oct. : 4 valides sur 6 (67 %), 2 situations 413 (trop grosses), pensees vides 0/4, ~27 etiquettes/jour (TPD 200 000 / ~7 400) ; NON viable"
rpm = 30
rpd = 1000
tpm = 8000
tpd = 200000
max_k = 1
minimal = true
json_object = true
json_schema = false                    # le schema complet (4 300 caracteres) ne tient pas dans 8 000 jetons/min : texte compact dans le prompt
compact = true
max_output = 2000
reasoning_effort = "low"

[[model]]
name = "groq/qwen/qwen3.8-27b"
provider = "groq"
enabled = false
note = "essai 16 oct. : 0/6, toutes 413 (son tokeniseur pese plus : >8 000 jetons) ; NON viable"
rpm = 30
rpd = 1000
tpm = 8000
tpd = 200000
max_k = 1
