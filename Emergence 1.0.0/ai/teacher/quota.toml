# ---- Gemma : peu de jetons par minute, enormement de requetes par jour (console du 15 oct. : 30 / 16 000 / 14 400, 6 et 8 utilisees).
# Le goulot est le TPM : texte fixe ~8 900 jetons + schema ~1 070 + ~2 600 par situation => un lot de 1 a 2 situations, ~1 requete par minute.

[[model]]
name = "gemma-4-31b-it"
enabled = false
note = "essai du 15 oct. (serie essai_gemma) : voir README.md, section Modeles ; activable par --models gemma-4-31b-it"
rpm = 30
rpd = 14400
tpm = 16000
json_schema = false                    # OBSERVE : 400 "invalid argument" avec le vrai schema (le petit schema de la sonde passait)
max_k = 2                              # 2 situations ~ 14 000 jetons (texte compact) : 1 a 2 par requete
compact = true
tpm_counts = "input"                   # OBSERVE : 429 "GenerateContentInputTokensPerModelPerMinute-FreeTier", quotaValue 16000

[[model]]
name = "gemma-4-26b-a4b-it"
enabled = false
note = "essai du 15 oct. (serie essai_gemma) : voir README.md, section Modeles ; activable par --models gemma-4-26b-a4b-it"
rpm = 30
rpd = 14400
tpm = 16000
json_schema = false
max_k = 2
compact = true
tpm_counts = "input"

