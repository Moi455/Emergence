pos_m = [6.5, 1.8, -5.0]
look_at_m = [1.6, 1.6, -0.5]
fov_deg = 50.0
hours = [18.4]

# De loin (20 m) : la lisibilité.
[[shot]]
name = "ensemble_loin"
pos_m = [1.5, 2.2, -20.0]
look_at_m = [1.6, 1.6, 0.0]
fov_deg = 40.0
hours = [10.0, 18.4]

# Golden hour (18 h 24 de l'horloge du labo) : le soleil est au nord-ouest, la face avant du mur (au sud) est à l'ombre ;
# on regarde donc le dos du mur (au nord) et l'auvent par l'ouest. Les ombres portées viendront avec L11.
[[shot]]
name = "dos_pres"
pos_m = [1.8, 1.5, 1.4]
look_at_m = [1.8, 1.3, 0.3]
fov_deg = 50.0
hours = [18.4]

[[shot]]
name = "ensemble_ouest"
