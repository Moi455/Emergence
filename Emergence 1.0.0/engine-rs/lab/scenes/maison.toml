# Scène « maison » (L34) : la maison de Monsieur (générateur de « nouvelle référence.html », cuite par
# tools/maisons/cuire.sh dans ~/.local/share/emergence/lab_assets/maisons/) posée sur le sol de turf du labo.
# Le CENTRE de la maison est en at_m (grille du générateur retournée en z, voir em_gen::PlacedHouse) ; la porte
# d'entrée est au sud (z négatif). La maison tient dans ~15 m : le maillage (25 m autour de la caméra) la couvre
# depuis toute prise à moins de 10 m. Positions relatives à `origin_m`, en mètres.
name = "maison"
origin_m = [10000.0, 0.0, 10000.0]
landscape = "flat_turf"

