# Scène « batiments » (L35) : planche-catalogue des bâtiments paramétriques du village (recettes nommées de
# engine/data/assets/batiments.toml). Première planche : 16 bâtiments en 4 rangées (x) de 4 (z) ; deuxième planche, plus
# à l'est (x >= 100 m) : puits, ponts, porte de ville. Le devant des bâtiments est au sud (z négatif). Positions en
# mètres relatives à origin_m ; le pivot d'un bâtiment est le centre de son emprise au sol. Les captures demandent un
# rayon de maillage large (`--maillage-rayon 110`).
name = "batiments"
origin_m = [10000.0, 0.0, 10000.0]
landscape = "flat_turf"

[style]
