<script>
'use strict';
//GEN-START
/* ============ Générateur de maison en voxels de 5 cm ============ */
const VS=.05,G=6,T=6,SH=54,PL=8,VMAX=320,UM=1100;

const sc=(c,f)=>[c[0]*f,c[1]*f,c[2]*f],mx=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];

const cl=v=>v<0?0:v>255?255:v|0;

const WOOD=[88,60,38],WOODD=[58,40,28],WOODL=[124,90,58],IRON=[46,44,48],MORT=[68,60,52],PLAS=[208,192,160],STN=[150,146,138],AMB=[255,198,104];

const TPAL={slate:[[78,84,94],[62,68,78],[100,104,110]],shingle:[[124,94,68],[98,72,52],[148,114,82]],terracotta:[[172,94,62],[142,72,50],[198,122,82]]};
const PC={brown:[100,68,42],green:[62,92,66],blue:[64,92,118],red:[134,64,54]};
const FL=[[238,234,224],[238,198,72],[218,122,164],[146,112,196]];

/* --- Graine -> paramètres (chaque partie est pilotée par un bloc de paramètres) --- */
function derive(seed){
 const R=mul(hs(seed)),r=(a,b)=>a+R()*(b-a),i=(a,b)=>Math.floor(r(a,b+.999)),pc=a=>a[i(0,a.length-1)],f2=x=>+x.toFixed(2);
 const P={seed},d=i(88,112);

 P.wing={w:i(56,Math.min(76,d*.78|0)),len:i(46,84),at:pc([0,1]),dir:pc([1,-1])};
 P.wall={style:pc(['stone','stone','timber-stone','timber-plaster']),stone:pc(['warm','grey','dark']),posts:i(40,56)};
 P.roof={slope:f2(r(1,1.5)),eave:i(8,12),rake:i(5,8),tile:pc(['slate','slate','shingle','terracotta']),moss:f2(r(.15,.55))};
 P.win={w:pc([14,16,18]),h:i(20,24),sill:i(16,20),arch:R()<.35,shutters:R()<.75,box:R()<.6,color:pc(['brown','green','blue','red']),lit:f2(r(.5,.95)),gap:i(44,58)};
 P.door={w:20,h:40,arch:R()<.5,at:f2(r(.3,.7)),porch:R()<.85,color:pc(['brown','green','blue','red'])};
 P.chimney={side:pc(['E','W'])};
 P.shed=R()<.8;
 P.deco={barrels:i(1,3),flowers:f2(r(.01,.05)),grass:f2(r(.04,.12))};

}

function build(P){
 const R=mul(hs(P.seed+'/d')),M=P.main,Wg=P.wing,st=P.stories,Hw=st*SH,RF=P.roof,WL=P.wall,WN=P.win,DR=P.door,EV=RF.eave,RK=RF.rake,TH=6,SL=RF.slope,sq=Math.sqrt(1+SL*SL);
 /* Volumes : corps principal (faîtage selon X) + aile éventuelle (faîtage selon Z) */

 for(const b of boxes){
  if(b.m){b.rx0=b.x0-RK;b.rx1=b.x1+RK;b.rz0=b.z0-EV;b.rz1=b.z1+EV}
  else{const hw=(b.x1-b.x0)/2|0;b.rx0=b.x0-EV;b.rx1=b.x1+EV;if(b.dir>0){b.rz0=M.d-hw-6;b.rz1=b.z1+RK}else{b.rz0=b.z0-RK;b.rz1=hw+6}}
 }

 /* Repère local d'une façade : u le long (vu de l'extérieur, gauche->droite), v hauteur, d profondeur (d<0 = extérieur). f: 0=E 1=O 2=S 3=N */
 const SF=(b,f)=>({b,f,len:f<2?b.z1-b.z0:b.x1-b.x0,xz:[(u,d)=>[b.x1-1-d,b.z1-1-u],(u,d)=>[b.x0+d,b.z0+u],(u,d)=>[b.x0+u,b.z1-1-d],(u,d)=>[b.x1-1-u,b.z0+d]][f]});
 const put=(fr,u,v,d,c,em)=>{const p=fr.xz(u,d);S(p[0],v,p[1],c,em)};
 const ext=(fr,u0,u1)=>{for(let u=u0;u<u1;u++){if(u<0||u>=fr.len)return false;const a=fr.xz(u,0),b=fr.xz(u,-1);if(!inF(a[0],a[1])||inF(b[0],b[1]))return false}return true};
 const freeOut=(fr,u0,u1,dd)=>{for(let u=u0;u<u1;u+=2)for(let d=1;d<=dd;d++){const p=fr.xz(u,-d);if(inF(p[0],p[1]))return false}return true};
 const occ=[],busy=(fr,u0,u1,v)=>occ.some(o=>o.b===fr.b&&o.f===fr.f&&u1>o.u0&&u0<o.u1&&v<o.vm),mark=(fr,u0,u1,vm)=>occ.push({b:fr.b,f:fr.f,u0,u1,vm});

 const uR=(b,f,c0,c1)=>f===2?[c0-b.x0,c1-b.x0]:f===3?[b.x1-c1,b.x1-c0]:f===0?[b.z1-c1,b.z1-c0]:[c0-b.z0,c1-b.z0];

 /* ---- Porte : position (sert aussi au chemin) ---- */

 if(strip)strip.d0=pickD(mz0,mz1,[]);
 const RR0=strip&&sW?mx0+SW+TP:mx0,RR1=strip&&!sW?mx1-SW-TP:mx1;
 if(strip&&db===mainB)du0=Math.max(sW?mx0+SW+TP+4:16,Math.min(sW?dfr.len-DR.w-16:mx1-SW-TP-4-DR.w,du0));
 const hz0=strip?(strip.dir>0?mz0+22:mz1-14-4*NS):0,hz1=strip?(strip.dir>0?mz0+14+4*NS:mz1-22):0;
 const inHole=(x,z)=>!!strip&&x>=strip.sx0&&x<strip.sx1&&z>=hz0&&z<hz1;
 const dxw=dfr.xz(du0+(DR.w>>1),0)[0],dz1=db.z1;
 const jun=boxes[1]?{wb:boxes[1],c0:boxes[1].dir>0?mz1:mz0-TP}:null;let jd0=0;
 if(strip){const[a,b2]=sW?[0,mx0+SW+TP+4]:[mx1-SW-TP-4,M.w];for(const f of[2,3]){const r=uR(mainB,f,a,b2);mark(SF(mainB,f),r[0],r[1],999)}mark(SF(mainB,sW?1:0),0,1e4,999)}
 if(jun){const wb=jun.wb;jd0=pickD(wb.x0+T+2,wb.x1-T-2,strip?[[strip.p0-3,strip.p0+TP+3]]:[]);if(jd0===null)jd0=wb.x0+T+6+Math.floor(R()*(wb.x1-wb.x0-2*T-12-DW+1));
  for(const f of[0,1]){const r=uR(wb,f,jun.c0-5,jun.c0+TP+5);mark(SF(wb,f),r[0],r[1],999)}
  const fj=wb.dir>0?2:3,r=uR(mainB,fj,jd0-4,jd0+DW+4);FT.push({b:mainB,f:fj,u0:r[0],u1:r[1],s:-1})}

 /* ---- Sol : herbe + chemin ---- */
 for(let Z=2;Z<NZ-2;Z++)for(let X=2;X<NX-2;X++){const x=X-OX,z=Z-OZ,n=vn(x*.05,z*.05,11),n2=hh(x,z,13);
  const dx=Math.abs(x-(dxw+5*Math.sin(z*.06))),pw=8+2*Math.sin(z*.13)-(z-dz1>60?(z-dz1-60)/12:0);

  for(let y=2;y<G-1;y++)g[(y*NZ+Z)*NX+X]=pk(sc([92,68,46],.9+hh(x,y,z)*.2));

 /* ---- Toit : surface = f(distance au faîtage), tuiles décalées, épaisseur 6 ---- */
 const roofAt=(b,x,z)=>{
  if(x<b.rx0||x>=b.rx1||z<b.rz0||z>=b.rz1)return null;
  const h=b.m?(b.z1-b.z0)/2:(b.x1-b.x0)/2,p=h-Math.abs((b.m?z+.5-(b.z0+b.z1)/2:x+.5-(b.x0+b.x1)/2)),t0=Math.floor(Hw+TH-1+SL*p),sl=(p+EV)*sq,cap=p>h-2.5;
  return{p,h,bot:t0-TH+1,top:t0+(cap?1:((sl%5)<2?1:0)),sl,cap,al:b.m?x:z}};
 const RB=new Int16Array(NX*NZ).fill(-32000);
 for(const b of boxes)for(let z=b.rz0;z<b.rz1;z++)for(let x=b.rx0;x<b.rx1;x++){const r=roofAt(b,x,z);if(r){const i=ix(x,z);if(r.bot>RB[i])RB[i]=r.bot}}
 const rtile=(sl,col,x,z)=>{
  const row=Math.floor(sl/5),fr=sl-row*5,off=col+(row&1)*3,pal=TPAL[RF.tile],t=hh(row,Math.floor(off/6),4);
  let c=t<.4?pal[0]:t<.75?pal[1]:pal[2];
  if(fr<1||off%6===0)c=sc(c,.62);
  const n=vn(x*.07,z*.07,5)*.7+vn(x*.3,z*.3,6)*.3,th=1-RF.moss*.9;

 /* ---- Pierre : assises irrégulières, pierres en relief, joints creusés ---- */
 const CV=new Uint16Array(VMAX),CF=new Uint16Array(VMAX),CH=[],SID=[],SB=[];

  const sid=new Uint16Array(UM),sb=[];let p=-Math.floor(R()*24);sb.push(p);

  SID[c]=sid;SB[c]=sb;v+=h}

  const c=CV[v],cf=CF[v],h=CH[c],s=SID[c][u],a=SB[c][s],b=SB[c][s+1];

 const wallC=(x,z,v,d,f,cor)=>{
  const u=(f<2?z:x)+300+f*37,sty=WL.style;
  if(sty!=='stone'&&v>=PL){
   let bm=v<PL+3;for(let k=1;k<=st;k++){const c0=k===st?Hw-5:k*SH-2;if(v>=c0&&v<c0+(k===st?5:4))bm=true}
   if(bm)return wood(v,d,2);
   if(cor||u%WL.posts<5)return wood(u,d,1);
   if(sty==='timber-plaster'){if(d<1)return null;return J(mx(PLAS,[132,112,86],Math.max(0,(PL+12-v)/(PL+12))*.6),x,v,z,.045)}

  return stoneC(u,v,d,x,z,0)};

 /* ---- Murs, sols ---- */
 for(let Z=0;Z<NZ;Z++)for(let X=0;X<NX;X++){const i=Z*NX+X;if(!FM[i])continue;const x=X-OX,z=Z-OZ;
  if(!DS[i]||DS[i]>T){
   S(x,-1,z,J([142,106,72],x,0,z,.07));if((x+z*3)%11===0)S(x,-1,z,[96,70,46]);
   for(let k=1;k<=st;k++){if(k===1&&inHole(x,z))continue;for(let v=k*SH-3;v<k*SH;v++)S(x,v,z,J([132,98,66],x,v,z,.07))}

  for(let a=0;a<3&&t1>=t0;a++){if(Math.abs(dd[a])<1e-9){if(oo[a]<b[a]-.5||oo[a]>b[a+3]+.5)t1=-1;continue}let ta=(b[a]-.5-oo[a])/dd[a],tb=(b[a+3]+.5-oo[a])/dd[a];if(ta>tb){const q=ta;ta=tb;tb=q}t0=Math.max(t0,ta);t1=Math.min(t1,tb)}
  if(t1<t0||t1<0)continue;if(t0<bt&&(!hs||hs.t>t0-1.5)){bt=t0;best=d}}
 return best}
function hitsDoor(d){const x0=Math.floor(pl.x-PR-1),x1=Math.floor(pl.x+PR+1),z0=Math.floor(pl.z-PR-1),z1=Math.floor(pl.z+PR+1),y0=Math.floor(pl.y),y1=Math.floor(pl.y+PH),{NX,NZ}=curO;
 for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++)for(let x=x0;x<=x1;x++)if(d.set.has((y*NZ+z)*NX+x))return true;return false}
function toggle(d){if(d.tg){if(hitsDoor(d))return;d.tg=0;for(const c of d.cells)DB.add(c)}else{d.tg=1;for(const c of d.cells)DB.delete(c)}}
function updHint(){const d=aimed();hint.hidden=!d;if(d)hint.textContent='F — '+(d.tg?'fermer':'ouvrir')+(d.kind==='win'?' la fenêtre':' la porte')}
/* ---- Entrée / sortie de visite ---- */
function enterVisit(){if(!curO)return;visit=true;ctl.enabled=false;saved={p:cam.position.clone(),f:cam.fov,n:cam.near};
 const s=curO.spawn;pl.x=s[0];pl.y=s[1];pl.z=s[2];pl.vy=0;pl.yaw=0;pl.pitch=0;
 cam.fov=72;cam.near=.03;cam.rotation.order='YXZ';cam.updateProjectionMatrix();
 $('vis').textContent='Quitter la visite';$('cross').hidden=false;$('help').hidden=false;setTimeout(()=>$('help').hidden=true,9000);
 cv.focus();try{const r=cv.requestPointerLock();if(r&&r.catch)r.catch(()=>{})}catch(e){}}
function exitVisit(){visit=false;ctl.enabled=true;for(const k in keys)keys[k]=false;
 if(document.pointerLockElement)document.exitPointerLock();
 hl.visible=false;cam.rotation.order='XYZ';cam.fov=saved?saved.f:36;cam.near=saved?saved.n:.1;cam.updateProjectionMatrix();if(saved)cam.position.copy(saved.p);ctl.update();
 $('vis').textContent='Visiter';$('cross').hidden=true;$('help').hidden=true;hint.hidden=true}
$('vis').onclick=()=>visit?exitVisit():enterVisit();
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===cv;if(visit&&!locked&&!drag)exitVisit()});
addEventListener('keydown',e=>{if(!visit)return;if(e.code==='Escape'){exitVisit();return}keys[e.code]=true;
 if(e.code==='KeyF'&&!e.repeat){const d=aimed();if(d)toggle(d)}
 if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.code]=false});addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
let hold=false,brkT=0;cv.addEventListener('mousedown',e=>{if(!visit)return;if(locked&&e.button===0){hold=true;brkT=0}else if(!locked)drag=true});addEventListener('mouseup',()=>{drag=false;hold=false});
addEventListener('mousemove',e=>{if(!visit||!(locked||drag))return;pl.yaw-=e.movementX*.0022;pl.pitch=Math.max(-1.45,Math.min(1.45,pl.pitch-e.movementY*.0022))});
function rs(){const w=innerWidth,h=innerHeight;ren.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
let last=performance.now();
(function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000||0);last=now;
 for(const d of drs){const t=Math.max(0,Math.min(1,d.t+(d.tg?1:-1)*dt/.45));if(t!==d.tt){d.t=d.tt=t;const e=t*t*(3-2*t);for(const pm of d.pm)pm.g.rotation.y=pm.th0+pm.dl*e}}
 if(visit){stepPlayer(dt);updHint();updHl();brkT-=dt;if((hold||keys.KeyE)&&brkT<=0&&curO){doBreak();brkT=.16}}else ctl.update();
 const cp=cam.position,a=LL.map(l=>({l,d:l.pos.distanceToSquared(cp)})).sort((x,y)=>x.d-y.d);
 for(let i=0;i<MAXL;i++){const p=pool[i],e=a[i];if(e){p.position.copy(e.l.pos);p.color.setHex(e.l.c);p.intensity=e.l.i;p.distance=e.l.d}else p.intensity=0}
 ren.render(scene,cam)})(performance.now());
gen();
