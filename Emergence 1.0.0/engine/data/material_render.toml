emission = 0.0
tint_mode = "ramp128"
flags = []

# ---- Terrain : rampe de 128 nuances, variante lente ----
[material.turf]
tint_mode = "terrain"
flags = ["skin"]
roughness = 0.95
relief = 0.25

[material.dirt]
tint_mode = "terrain"
flags = ["skin"]
roughness = 0.95
relief = 0.3

[material.clay]
