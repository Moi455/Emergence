flags = ["skin"]
voxel_jitter = 0.06
[material.forest_floor]
tint_mode = "terrain"
flags = ["skin", "moss"]
roughness = 0.95
[material.snow]
tint_mode = "terrain"
flags = ["skin"]
roughness = 0.6
albedo_var = 0.03
relief = 0.1

