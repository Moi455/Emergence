<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#efe3cf}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js","three/addons/":"../node_modules/three/examples/jsm/"}}</script>
</head><body><script type="module">
import * as THREE from 'three';
import { generateVillager, composeOutfit, meshOutfit } from '../gen/villager.js';
const qs = new URLSearchParams(location.search);
window.CATALOG = await (await fetch('../data/catalog.json')).json();
const seeds = (qs.get('seeds')||'1,2,3,4').split(',').map(Number);
const W = +(qs.get('w')||1600), H = +(qs.get('h')||900);
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setSize(W,H); renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE[qs.get('tm')||'ACESFilmicToneMapping']; renderer.toneMappingExposure=+(qs.get('ex')||1.25);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#efe3cf');
scene.add(new THREE.HemisphereLight('#ffeedd','#6a5a50',1.0));
const sun = new THREE.DirectionalLight('#ffe2c0',2.8); sun.position.set(-2,4,3); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-4;sun.shadow.camera.right=4;sun.shadow.camera.top=3;sun.shadow.camera.bottom=-1; sun.shadow.bias=-0.0005; sun.shadow.normalBias=0.01;
scene.add(sun);
const fill = new THREE.DirectionalLight('#cfe0ff',0.5); fill.position.set(3,2,-2); scene.add(fill);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(30,30), new THREE.ShadowMaterial({opacity:0.18})); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
const zoom = qs.get('zoom');
const cam = new THREE.PerspectiveCamera(zoom?14:22, W/H, 0.1, 100);
const occ = qs.get('occ')||'everyday';
const t0=performance.now(); let tris=0;
const spacing = qs.get('portrait') ? 0.55 : 0.75;
seeds.forEach((s,i)=>{
  const v = generateVillager(s, window.CATALOG, {village: qs.get('village')||undefined, job: qs.get('job')||undefined});
  console.log(s, v.bp.sex, v.bp.age, v.wardrobe.village, v.wardrobe.job, JSON.stringify(v.wardrobe.outfits[occ].map(id=>v.wardrobe.garments.find(g=>g.id===id).type)));
  const grid = composeOutfit(v, occ, null);
  const m = meshOutfit(v.base, grid);
  tris += m.indices.length/3;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(m.positions,3));
  g.setAttribute('normal', new THREE.BufferAttribute(m.normals,3));
  g.setAttribute('uv', new THREE.BufferAttribute(m.uvs,2));
  g.setIndex(new THREE.BufferAttribute(m.indices,1));
  const tex = new THREE.DataTexture(m.atlas.data, m.atlas.w, m.atlas.h, THREE.RGBAFormat);
  tex.magFilter = tex.minFilter = THREE.NearestFilter; tex.colorSpace = THREE.SRGBColorSpace; tex.needsUpdate = true;
  const mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({map:tex, roughness:0.9, metalness:0}));
  mesh.castShadow = mesh.receiveShadow = true;
  mesh.position.x = (i-(seeds.length-1)/2)*spacing;
  mesh.rotation.y = +(qs.get('rot')||0.45);
  scene.add(mesh);
});
if (qs.get('portrait')) { cam.fov=20; cam.updateProjectionMatrix(); cam.position.set(0,1.5,seeds.length*0.55*1.6+0.6); cam.lookAt(0,1.38,0); }
else if (zoom) { cam.position.set(0,+(qs.get("cy")||1.5),+(qs.get("cd")||2.0)); cam.lookAt(0,+(qs.get("cy")||1.5)-0.05,0); }
else { const span = seeds.length*spacing; cam.position.set(0,1.3, Math.max(4, span*1.25)); cam.lookAt(0,0.85,0); }
renderer.render(scene,cam);
document.title = 'done '+Math.round(performance.now()-t0)+'ms tris='+tris;
</script></body></html>
