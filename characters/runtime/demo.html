<!doctype html><meta charset="utf-8"><title>Villageois en WebGL2</title>
<style>html,body{margin:0;height:100%;background:#cdd6dc}canvas{width:100%;height:100%;display:block}</style>
<canvas id="c"></canvas>
<script type="module">
// Raw WebGL2 demo: 4 villagers playing idle / walk / work / talk. Serve the "personnages" folder over http.
import { makeVillager, uploadVillager, villagerProgram } from './webgl2.js';
const qs = new URLSearchParams(location.search);
const cat = await (await fetch('../data/catalog.json')).json();
const c = document.getElementById('c'); c.width = innerWidth; c.height = innerHeight;
const gl = c.getContext('webgl2', { antialias: true, powerPreference: 'low-power' });
const prog = villagerProgram(gl);
const clips = qs.has('clip') ? [qs.get('clip')] : ['idle', 'walk', 'work', 'talk'];
const spread = +(qs.get('spread') || 0);
// villagers by id in the population (data/villagers.json), or raw seeds with ?seeds=
const pop = (await (await fetch('../data/villagers.json')).json()).villagers;
const recs = qs.has('seeds') ? qs.get('seeds').split(',').map(s => ({ seed: +s }))
  : (qs.get('ids') || '5,120,240,176').split(',').map(i => pop[+i]);
const vs = recs.map(r => uploadVillager(gl, makeVillager(r.seed, cat, { village: r.village, outfit: qs.get('outfit') || 'work' })));
function persp(f, a, n, fa) { const t = 1 / Math.tan(f / 2); return [t / a, 0, 0, 0, 0, t, 0, 0, 0, 0, (fa + n) / (n - fa), -1, 0, 0, 2 * fa * n / (n - fa), 0]; }
function mul(a, b) { const o = new Array(16); for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + j] * b[i * 4 + k]; o[i * 4 + j] = s; } return o; }
function lookAt(e, t) { const z = [e[0] - t[0], e[1] - t[1], e[2] - t[2]], zl = Math.hypot(...z); z.forEach((v, i) => z[i] = v / zl); const x = [z[2], 0, -z[0]], xl = Math.hypot(...x); x.forEach((v, i) => x[i] = v / xl); const y = [z[1] * x[2] - z[2] * x[1], z[2] * x[0] - z[0] * x[2], z[0] * x[1] - z[1] * x[0]]; return [x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -(x[0] * e[0] + x[1] * e[1] + x[2] * e[2]), -(y[0] * e[0] + y[1] * e[1] + y[2] * e[2]), -(z[0] * e[0] + z[1] * e[1] + z[2] * e[2]), 1]; }
const vp = mul(persp(0.42, c.width / c.height, 0.1, 50), lookAt([0, 1.3, 6.2], [0, 0.9, 0]));
const t0 = performance.now();
function frame() {
  const t = qs.has('t') ? +qs.get('t') : (performance.now() - t0) / 1000;
  gl.viewport(0, 0, c.width, c.height); gl.clearColor(0.8, 0.84, 0.86, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT); gl.enable(gl.DEPTH_TEST); gl.enable(gl.CULL_FACE);
  vs.forEach((v, i) => {
    v.pose(clips[i % clips.length], t + i * spread);
    const a = +(qs.get('a') ?? 0.5), x = (i - (vs.length - 1) / 2) * 0.85;
    v.draw(prog, vp, [Math.cos(a), 0, -Math.sin(a), 0, 0, 1, 0, 0, Math.sin(a), 0, Math.cos(a), 0, x, 0, 0, 1]);
  });
  if (qs.has('t')) document.title = 'done'; else requestAnimationFrame(frame);
}
frame();
</script>
